<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sarkin Wanka — Gestion d’atelier</title>
<meta name="theme-color" content="#a67c00"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Sarkin Wanka">
<link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" href="assets/img/icon-192.png"><link rel="apple-touch-icon" href="assets/img/icon-192.png">
<style>
:root{--bg:#f7f3ea;--card:#fff;--tx:#201a0e;--mu:#7a705c;--ln:#e6dcc3;--gd:#a67c00;--gl:#f3e6bd;--ok:#2f8f5b;--wr:#d98a00;--er:#c8412d;--sb:#1d1809;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14110a;--card:#1f1a0f;--tx:#f3ecd9;--mu:#a99d82;--ln:#352d1a;--gl:#3a2f10;--sb:#0d0b06;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14110a;--card:#1f1a0f;--tx:#f3ecd9;--mu:#a99d82;--ln:#352d1a;--gl:#3a2f10;--sb:#0d0b06;color-scheme:dark}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:700}
nav{width:220px;background:var(--sb);color:#e9dfc2;padding:20px 12px;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:18px;padding:0 6px}
.mono{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#a67c00,#e0b83a);display:grid;place-items:center;color:#1d1809;font:700 16px Georgia,serif;flex-shrink:0}
.brand b{font:700 15px Georgia,serif;line-height:1.1}.brand small{color:#a99d82;font-size:11px}
nav a{color:inherit;text-decoration:none;padding:10px 12px;border-radius:10px;display:flex;gap:10px;align-items:center;font-weight:500}
nav a.on{background:var(--gd);color:#fff}nav a:hover:not(.on){background:#2b2412}
main{flex:1;overflow-y:auto;padding:22px 26px 40px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.top h2{font-size:26px}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--gl);color:var(--gd);font-weight:600;white-space:nowrap}
.pill.ok{background:#dff3e7;color:var(--ok)}.pill.er{background:#fbe1dc;color:var(--er)}.pill.wr{background:#fdeccb;color:#a66a00}
.btn{border:0;background:var(--gd);color:#fff;padding:9px 15px;border-radius:10px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--ln)}.btn.d{background:var(--er)}.btn.s{padding:5px 9px;font-size:13px}
.btn:active{transform:scale(.97)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px}
.kpi small{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.5px}.kpi div{font:700 22px Georgia,serif;margin-top:4px}
.kan{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:12px;overflow-x:auto;padding-bottom:10px}
.col{background:color-mix(in srgb,var(--ln) 35%,transparent);border-radius:14px;padding:10px;min-height:120px}
.col h3{font-size:15px;margin:2px 4px 10px;display:flex;justify-content:space-between}
.o{background:var(--card);border:1px solid var(--ln);border-left:4px solid var(--gd);border-radius:12px;padding:11px;margin-bottom:9px}
.o.late{border-left-color:var(--er)}.o h4{font-size:15px}.o p{color:var(--mu);font-size:13px;margin-top:2px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:center}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px 8px;border-bottom:1px solid var(--ln);font-size:14px}th{color:var(--mu);font-size:12px;text-transform:uppercase}
.tw{overflow-x:auto}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--ln);border-radius:9px;background:var(--bg);color:var(--tx);font:16px inherit;font-family:inherit}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px;font-weight:600}
.bg{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:14px;z-index:50}
.md{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:640px;max-height:92%;overflow-y:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--sb);color:#fff;padding:10px 16px;border-radius:99px;z-index:99;font-size:14px}
.empty{color:var(--mu);text-align:center;padding:18px;font-size:14px}
#rcp{display:none}
@media print{body>*:not(#rcp){display:none!important}#rcp{display:block;color:#000;background:#fff;font:14px/1.5 system-ui,sans-serif;max-width:380px;margin:0 auto;padding:10px}}
.rc h2{text-align:center;font-size:20px}.rc p{text-align:center;font-size:12px}.rc hr{border:0;border-top:1px dashed #000;margin:10px 0}.rc td{padding:3px 0;border:0;font-size:inherit}.rc th{color:#000;font-size:inherit;border-bottom:1px solid #000;padding:3px 4px 3px 0}.rc .r{text-align:right}
.ban{background:#fbe1dc;color:var(--er);padding:10px 14px;border-radius:12px;margin-bottom:14px;font-weight:600}
@media(max-width:760px){body{flex-direction:column-reverse}
nav{width:100%;flex-direction:row;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;position:fixed;bottom:0;left:0;z-index:20}
.brand{display:none}nav a{flex-direction:column;gap:1px;font-size:10px;padding:6px 4px}nav a span{font-size:19px}
main{padding:16px 14px 90px}.top h2{font-size:22px}}
</style></head><body>
<nav id="nav"></nav><main id="app"></main>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
const STEPS=[["rdv","Rendez-vous"],["atelier","En atelier"],["pret","Prêt en boutique"],["livre","Livré"]];
const VIEWS=[["dashboard","📊","Tableau de bord"],["commandes","🧵","Commandes"],["clients","👤","Clients"],["historique","📜","Historique"],["atelier","✂️","Atelier"],["finances","💰","Finances"],["parametres","⚙️","Paramètres"],["securite","🔒","Sécurité",1]];
const blank=()=>({orders:[],tailors:[],tpay:[],stock:[],expenses:[],settings:{name:"Sarkin Wanka Fashion Design",phone:"",cur:"FCFA",addr:"Niamey, Niger",foot:"Merci de votre confiance !",cond:"Tout vêtement non retiré sous 30 jours n’est plus sous la responsabilité de l’atelier.",mode:"pct",rate:30,pwh:"",fmt:"80",fdoc:"a4",apNew:true,apPay:true,apDel:true,apTp:true,lockMin:0,tfa:"",tbk:[]},meta:{lastSnap:0,lastExport:0,n:0,no:0}});
const norm=d=>{const b=blank();d=Object.assign(b,d);d.settings={...blank().settings,...d.settings};d.meta={...blank().meta,...d.meta};let m=d.meta.no||0;d.orders.filter(o=>!o.no).sort((a,b)=>(a.created||0)-(b.created||0)).forEach(o=>o.no=++m);d.meta.no=m;return d};
let S=blank(),q="",qc="",hq="",hfl={e:"",p:"",tl:"",a:"",b:""},_new=null,ok=true;
const fm=n=>(+n||0).toLocaleString("fr-FR")+" "+S.settings.cur;
const paid=o=>(o.pay||[]).reduce((a,p)=>a+p.a,0);
const rest=o=>Math.max(0,(+o.price||0)-paid(o));
const late=o=>o.step!=="livre"&&o.due&&o.due<today();
const wa=(p,m)=>"https://wa.me/"+String(p||"").replace(/\D/g,"")+"?text="+encodeURIComponent(m);
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)}

/* ===== STOCKAGE ROBUSTE : IndexedDB + copie localStorage + instantanés ===== */
const idb=new Promise((res,rej)=>{const r=indexedDB.open("sarkin-wanka",1);r.onupgradeneeded=()=>{r.result.createObjectStore("kv");r.result.createObjectStore("snaps")};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function tx(st,mode,fn){const d=await idb;return new Promise((res,rej)=>{const t=d.transaction(st,mode);const rq=fn(t.objectStore(st));t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
let chain=Promise.resolve();
function persist(){ // écritures sérialisées : aucune sauvegarde ne se perd ni ne s’entrecroise
  const json=JSON.stringify(S);
  try{localStorage.setItem("sw_mirror",json)}catch(e){}
  chain=chain.then(async()=>{try{await tx("kv","readwrite",s=>s.put(json,"db"));ok=true}catch(e){ok=false}stat()});
  return chain}
async function snapshot(force){
  const now=Date.now();if(!force&&now-S.meta.lastSnap<36e5)return;
  S.meta.lastSnap=now;const json=JSON.stringify(S);
  try{await tx("snaps","readwrite",s=>s.put(json,now));const ks=await tx("snaps","readonly",s=>s.getAllKeys());
  if(ks.length>20)await tx("snaps","readwrite",s=>{ks.sort((a,b)=>a-b).slice(0,ks.length-20).forEach(k=>s.delete(k))})}catch(e){}}
function mut(fn,msg){fn();S.meta.n++;persist();snapshot(S.meta.n%25===0);render();if(msg)toast(msg)}
function stat(){const e=$("#st");if(e){e.className="pill "+(ok?"ok":"er");e.textContent=ok?"✓ Enregistré":"⚠ Erreur d’enregistrement"}}
async function load(){
  let raw=null;try{raw=await tx("kv","readonly",s=>s.get("db"))}catch(e){}
  if(!raw)raw=localStorage.getItem("sw_mirror");
  if(raw){try{S=norm(JSON.parse(raw))}catch(e){toast("Données illisibles — restaurez un instantané")}}
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
  render();if(S.settings.pwh)lock()}
addEventListener("pagehide",()=>persist());
document.addEventListener("visibilitychange",()=>{if(document.hidden)persist()});

/* ===== FENÊTRES ===== */
function modal(title,html,onOk,okLabel){
  const bg=document.createElement("div");bg.className="bg";
  bg.innerHTML=`<form class="md"><h3 style="margin-bottom:6px">${title}</h3>${html}<div class="row" style="margin-top:16px;justify-content:flex-end"><button type="button" class="btn g" data-x>${onOk?"Annuler":"Fermer"}</button>${onOk?`<button class="btn">${okLabel||"Enregistrer"}</button>`:""}</div></form>`;
  document.body.appendChild(bg);const f=bg.firstChild;
  bg.querySelector("[data-x]").onclick=()=>bg.remove();
  f.onsubmit=e=>{e.preventDefault();if(onOk&&onOk(Object.fromEntries(new FormData(f)))!==false)bg.remove()};
  const i=f.querySelector("input,select");if(i&&!/Mobi/.test(navigator.userAgent))i.focus()}
const ask=(msg,fn)=>modal("Confirmation",`<p style="margin-top:8px">${msg}</p>`,()=>{fn()},"Confirmer");

/* ===== COMMANDES ===== */
function orderForm(o){
  const n=!o;o=o||{step:"rdv",due:today()};
  modal(n?"Nouvelle commande":"Modifier la commande",`
  <label>Client</label><input name="client" required value="${esc(o.client)}" list="cl" oninput="fillPh(this)">
  <datalist id="cl">${[...new Set(S.orders.map(x=>x.client))].map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
  <div class="two"><div><label>Téléphone / WhatsApp</label><input name="phone" type="tel" value="${esc(o.phone)}"></div>
  <div><label>Vêtement</label><input name="type" required value="${esc(o.type)}"></div></div>
  <div class="two"><div><label>Prix (${S.settings.cur})</label><input name="price" type="number" min="0" value="${o.price||""}"></div>
  ${n?`<div><label>Acompte versé</label><input name="dep" type="number" min="0"></div>`:`<div><label>Déjà payé</label><input disabled value="${fm(paid(o))}"></div>`}</div>
  <div class="two"><div><label>Date de livraison</label><input name="due" type="date" value="${esc(o.due)}"></div>
  <div><label>Étape</label><select name="step">${STEPS.map(s=>`<option value="${s[0]}"${o.step===s[0]?" selected":""}>${s[1]}</option>`).join("")}</select></div></div>
  <label>Tailleur</label><select name="tailor"><option value="">— Non assigné —</option>${S.tailors.map(t=>`<option${o.tailor===t.name?" selected":""}>${esc(t.name)}</option>`).join("")}</select>
  <label>Mesures & notes</label><textarea name="notes" rows="3">${esc(o.notes)}</textarea>`,
  d=>{mut(()=>{const base={client:d.client.trim(),phone:d.phone.trim(),type:d.type.trim(),price:+d.price||0,due:d.due,step:d.step,tailor:d.tailor,notes:d.notes.trim()};
    if(n){const x={id:uid(),no:++S.meta.no,created:Date.now(),pay:+d.dep>0?[{d:today(),a:+d.dep}]:[],...base};stamp(x);_new=x.id;S.orders.push(x)}else{Object.assign(o,base);stamp(o)}},n?"Commande enregistrée ✓":"Modifiée ✓");if(n&&_new&&S.settings.apNew){autoPrint(_new);_new=null}})}
function pay(id){const o=S.orders.find(x=>x.id===id);
  modal("Encaisser un paiement",`<p style="color:var(--mu)">${esc(o.client)} — reste ${fm(rest(o))}</p><label>Montant</label><input name="a" type="number" min="1" required value="${rest(o)||""}">`,
  d=>{mut(()=>{(o.pay=o.pay||[]).push({d:today(),a:+d.a})},"Paiement enregistré ✓");if(S.settings.apPay)autoPrint(o.id)},"Encaisser")}
function move(id,dir){const o=S.orders.find(x=>x.id===id),i=STEPS.findIndex(s=>s[0]===o.step)+dir;if(i<0||i>3)return;
  const go=()=>{mut(()=>{o.step=STEPS[i][0];stamp(o)},"→ "+STEPS[i][1]);if(STEPS[i][0]==="livre"&&S.settings.apDel)autoPrint(o.id)};
  if(STEPS[i][0]==="livre"&&rest(o)>0)ask(`Il reste ${fm(rest(o))} à payer. Livrer quand même ?`,go);else go()}
const delOrder=id=>ask("Supprimer cette commande ? (un instantané est conservé)",()=>{snapshot(true);mut(()=>{S.orders=S.orders.filter(x=>x.id!==id)},"Supprimée")});
const editOrder=id=>orderForm(S.orders.find(x=>x.id===id));
function card(o){const r=rest(o);return `<div class="o${late(o)?" late":""}"><h4>${esc(o.client)}</h4><p>${esc(o.type)}${o.tailor?" · ✂ "+esc(o.tailor):""}</p>
<p>${late(o)?"<b style='color:var(--er)'>En retard · </b>":""}📅 ${o.due?new Date(o.due).toLocaleDateString("fr-FR"):"—"}</p>
<p><b>${fm(o.price)}</b> · ${r?`<span style="color:var(--er)">reste ${fm(r)}</span>`:`<span style="color:var(--ok)">soldé ✓</span>`}</p>${o.notes?`<p>📏 ${esc(o.notes)}</p>`:""}
<div class="row"><button class="btn g s" onclick="move('${o.id}',-1)">←</button><button class="btn s" onclick="move('${o.id}',1)">→</button>
${r?`<button class="btn g s" onclick="pay('${o.id}')">💵</button>`:""}${o.phone?`<a class="btn g s" style="text-decoration:none" target="_blank" href="${wa(o.phone,o.step==="pret"?`Bonjour ${o.client}, votre ${o.type} est prêt chez ${S.settings.name}.${r?" Reste à payer : "+fm(r)+".":""}`:`Bonjour ${o.client}, ici ${S.settings.name}.`)}">💬</a>`:""}
<button class="btn g s" onclick="receipt('${o.id}')">🧾</button><button class="btn g s" onclick="editOrder('${o.id}')">✏️</button><button class="btn g s" onclick="delOrder('${o.id}')">🗑</button></div></div>`}
function drawKan(){const k=$("#kan");if(!k)return;const s=q.toLowerCase();
  const L=S.orders.filter(o=>!s||(o.client+o.type+o.phone).toLowerCase().includes(s)).sort((a,b)=>(a.due||"").localeCompare(b.due||""));
  k.innerHTML=STEPS.map(([id,lb])=>{const l=L.filter(o=>o.step===id);return `<div class="col"><h3>${lb}<span class="pill">${l.length}</span></h3>${l.map(card).join("")||'<div class="empty">Vide</div>'}</div>`}).join("")}

/* ===== VUES ===== */
const V={
dashboard(){const O=S.orders,ca=O.reduce((a,o)=>a+(+o.price||0),0),enc=O.reduce((a,o)=>a+paid(o),0),dep=S.expenses.reduce((a,e)=>a+e.a,0);
  const lt=O.filter(late),soon=O.filter(o=>o.step!=="livre"&&!late(o)&&o.due&&o.due<=new Date(Date.now()+7*864e5).toISOString().slice(0,10)),low=S.stock.filter(s=>s.qty<=s.min);
  return `
  <div class="grid">${STEPS.map(([id,lb])=>`<div class="card kpi"><small>${lb}</small><div>${O.filter(o=>o.step===id).length}</div></div>`).join("")}</div>
  ${lt.length?`<div class="ban">⚠ ${lt.length} commande(s) en retard : ${lt.slice(0,4).map(o=>esc(o.client)).join(", ")}</div>`:""}
  ${low.length?`<div class="ban" style="background:#fdeccb;color:#a66a00">📦 Stock bas : ${low.map(s=>esc(s.name)).join(", ")}</div>`:""}
  <div class="card"><h3 style="margin-bottom:8px">À livrer sous 7 jours</h3>${soon.length?soon.map(card).join(""):'<div class="empty">Rien d’urgent</div>'}</div>`},
commandes(){return `<input id="q" list="sg" placeholder="🔍 Nom, numéro ou vêtement… (suggestions)" value="${esc(q)}" style="margin-bottom:12px">${sgList()}<div class="kan" id="kan"></div>`},
historique(){const F=hfl,sel=(n,o,v)=>`<select name="${n}" class="hf">${o.map(([k,l])=>`<option value="${esc(k)}"${k===v?" selected":""}>${esc(l)}</option>`).join("")}</select>`;
  return `<div class="card" style="margin-bottom:12px"><input id="qh" list="sg" placeholder="🔍 Nom, numéro, vêtement ou n° de reçu (R-0001)…" value="${esc(hq)}">${sgList()}<div class="grid" style="margin:10px 0 0;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">${sel("e",[["","Tous les états"],...STEPS.map(x=>[x[0],x[1]])],F.e)}${sel("p",[["","Tous paiements"],["s","Soldé"],["i","Reste à payer"]],F.p)}${sel("tl",[["","Tous tailleurs"],...S.tailors.map(t=>[t.name,t.name])],F.tl)}<input type="date" name="a" class="hf" value="${F.a}" title="Du"><input type="date" name="b" class="hf" value="${F.b}" title="Au"></div><div class="row" style="margin-top:10px"><button class="btn g s" onclick="resetH()">✕ Réinitialiser</button><button class="btn g s" onclick="printHist()">🖨 Imprimer la liste</button></div></div><div id="hl"></div>`},
clients(){return `<input id="qc" list="sg" placeholder="🔍 Nom ou numéro… (suggestions)" style="margin-bottom:12px">${sgList()}<div id="clt"></div>`},
clientsT(){const m={};S.orders.filter(o=>!qc||(o.client+o.phone).toLowerCase().includes(qc)).forEach(o=>{const k=(o.phone||o.client).toLowerCase();const c=m[k]=m[k]||{n:o.client,p:o.phone,c:0,t:0,r:0};c.c++;c.t+=+o.price||0;c.r+=rest(o)});
  const L=Object.values(m).sort((a,b)=>b.t-a.t);
  return `<div class="card tw"><table><tr><th>Client</th><th>Commandes</th><th>Total</th><th>Reste dû</th><th></th></tr>${L.map(c=>`<tr><td><b>${esc(c.n)}</b><br><small style="color:var(--mu)">${esc(c.p)}</small></td><td>${c.c}</td><td>${fm(c.t)}</td><td style="color:${c.r?"var(--er)":"var(--ok)"}">${fm(c.r)}</td><td>${c.p?`<a class="btn g s" style="text-decoration:none" target="_blank" href="${wa(c.p,"Bonjour "+c.n+", ici "+S.settings.name+".")}">💬</a>`:""}</td></tr>`).join("")||'<tr><td colspan=5 class="empty">Aucun client pour l’instant</td></tr>'}</table></div>`},
atelier(){return `<div class="top"><h3>Tailleurs</h3><button class="btn s" onclick="addTailor()">+ Tailleur</button></div><div class="grid">${S.tailors.map(t=>{const w=S.orders.filter(o=>o.tailor===t.name&&o.step==="atelier");return `<div class="card"><b>✂ ${esc(t.name)}</b><div style="margin:6px 0;color:var(--mu)">${w.length} pièce(s) en cours</div>${w.map(o=>`<div style="font-size:13px">• ${esc(o.type)} (${esc(o.client)})${late(o)?" ⚠":""}</div>`).join("")}<div class="row"><button class="btn g s" onclick="delTailor('${t.id}')">Retirer</button></div></div>`}).join("")||'<div class="empty">Ajoutez vos tailleurs</div>'}</div>
  <div class="top"><h3>Stock (tissus, fils, fournitures)</h3><button class="btn s" onclick="addStock()">+ Article</button></div>

finances(){return finTop()+finTailors()+V.finances2()},
finances2(){const tot=S.expenses.reduce((a,e)=>a+e.a,0),P=S.orders.flatMap(o=>(o.pay||[]).map(p=>({...p,c:o.client}))).sort((a,b)=>b.d.localeCompare(a.d));
  return `<div class="top"><h3>Dépenses · ${fm(tot)}</h3><button class="btn s" onclick="addExp()">+ Dépense</button></div><div class="card tw"><table><tr><th>Date</th><th>Libellé</th><th>Montant</th><th></th></tr>${[...S.expenses].sort((a,b)=>b.d.localeCompare(a.d)).map(e=>`<tr><td>${e.d}</td><td>${esc(e.l)}</td><td>${fm(e.a)}</td><td><button class="btn g s" onclick="delExp('${e.id}')">🗑</button></td></tr>`).join("")||'<tr><td colspan=4 class="empty">Aucune dépense</td></tr>'}</table></div>
  <h3 style="margin:18px 0 8px">Paiements reçus</h3><div class="card tw"><table>${P.slice(0,40).map(p=>`<tr><td>${p.d}</td><td>${esc(p.c)}</td><td><b>${fm(p.a)}</b></td></tr>`).join("")||'<tr><td class="empty">Aucun paiement</td></tr>'}</table></div>`},
parametres(){return paramTop()+V.sauv()},
securite(){return secView()},
sauv(){return `<h3 style="margin-bottom:8px">💾 Sauvegardes</h3><div class="grid"><div class="card"><b>État</b><p style="margin:6px 0">${ok?"✅ Tout est enregistré automatiquement à chaque action (base locale + copie de sécurité).":"⚠ Problème de stockage : exportez vos données maintenant."}</p><p style="color:var(--mu);font-size:13px">Dernier export : ${S.meta.lastExport?new Date(S.meta.lastExport).toLocaleString("fr-FR"):"jamais"}</p></div></div>
  <div class="row" style="margin-bottom:16px"><button class="btn" onclick="exportJSON()">⬇ Exporter une sauvegarde</button><label class="btn g" style="margin:0;cursor:pointer;color:var(--tx);font-size:14px">⬆ Importer<input type="file" accept=".json" hidden onchange="importJSON(this.files[0])"></label><button class="btn g" onclick="snapshot(true).then(render)">📸 Instantané maintenant</button></div>
  <h3 style="margin-bottom:8px">Instantanés automatiques (20 derniers)</h3><div class="card tw" id="snaps"></div>
  `}};
function saveSet(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.rate=+d.rate||0;["apNew","apPay","apDel","apTp"].forEach(k=>d[k]=k in d);mut(()=>Object.assign(S.settings,d),"Paramètres enregistrés ✓")}
function addTailor(){const c=S.settings;modal("Nouveau tailleur",`<label>Nom</label><input name="n" required><div class="two"><div><label>Rémunération</label><select name="m"><option value="pct"${c.mode==="pct"?" selected":""}>% du prix de la pièce</option><option value="fix"${c.mode==="fix"?" selected":""}>Montant fixe / pièce</option></select></div><div><label>Valeur</label><input name="r" type="number" min="0" value="${c.rate}"></div></div>`,d=>{if(S.tailors.some(t=>t.name.toLowerCase()===d.n.trim().toLowerCase())){toast("Ce tailleur existe déjà");return false}mut(()=>S.tailors.push({id:uid(),name:d.n.trim(),mode:d.m,rate:+d.r||0}),"Ajouté ✓")})}
const delTailor=id=>ask("Retirer ce tailleur ?",()=>mut(()=>{S.tailors=S.tailors.filter(t=>t.id!==id)}));
function addStock(){modal("Nouvel article",`<label>Nom</label><input name="n" required><div class="two"><div><label>Quantité</label><input name="q" type="number" value="0"></div><div><label>Unité</label><input name="u" value="m"></div></div><label>Alerte si ≤</label><input name="m" type="number" value="2">`,d=>mut(()=>S.stock.push({id:uid(),name:d.n.trim(),qty:+d.q,u:d.u,min:+d.m}),"Ajouté ✓"))}
const qty=(id,n)=>mut(()=>{const s=S.stock.find(x=>x.id===id);s.qty=Math.max(0,s.qty+n)});
const delStock=id=>ask("Supprimer cet article ?",()=>mut(()=>{S.stock=S.stock.filter(s=>s.id!==id)}));
function addExp(){modal("Nouvelle dépense",`<label>Libellé</label><input name="l" required placeholder="Tissu, loyer, électricité…"><div class="two"><div><label>Montant</label><input name="a" type="number" min="1" required></div><div><label>Date</label><input name="d" type="date" value="${today()}"></div></div>`,d=>mut(()=>S.expenses.push({id:uid(),l:d.l.trim(),a:+d.a,d:d.d}),"Dépense enregistrée ✓"))}
const delExp=id=>ask("Supprimer cette dépense ?",()=>mut(()=>{S.expenses=S.expenses.filter(e=>e.id!==id)}));
function exportJSON(){S.meta.lastExport=Date.now();persist();const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));a.download="sarkin-wanka-"+today()+".json";a.click();render();toast("Sauvegarde téléchargée ✓")}
function importJSON(f){if(!f)return;f.text().then(t=>{let d;try{d=JSON.parse(t);if(!Array.isArray(d.orders))throw 0}catch(e){return toast("Fichier invalide")}
  ask(`Remplacer les données actuelles par ce fichier (${d.orders.length} commandes) ? Un instantané est créé avant.`,async()=>{await snapshot(true);mut(()=>{S=norm(d)},"Données importées ✓")})})}
async function drawSnaps(){const e=$("#snaps");if(!e)return;let ks=[];try{ks=(await tx("snaps","readonly",s=>s.getAllKeys())).sort((a,b)=>b-a)}catch(x){}
  e.innerHTML=ks.length?`<table>${ks.map(k=>`<tr><td>${new Date(k).toLocaleString("fr-FR")}</td><td style="text-align:right"><button class="btn g s" onclick="restore(${k})">Restaurer</button></td></tr>`).join("")}</table>`:'<div class="empty">Les instantanés apparaîtront ici</div>'}
function restore(k){ask("Restaurer cet instantané ? L’état actuel est d’abord sauvegardé.",async()=>{const raw=await tx("snaps","readonly",s=>s.get(k));await snapshot(true);mut(()=>{S=norm(JSON.parse(raw))},"Instantané restauré ✓")})}

/* ===== REÇUS, HISTORIQUE, TAILLEURS, SÉCURITÉ ===== */
const rno=o=>"R-"+String(o.no||0).padStart(4,"0");
const fd=d=>d?new Date(d).toLocaleDateString("fr-FR"):"—";
const anyF=()=>hq||Object.values(hfl).some(Boolean);
const hf=o=>{const f=hfl,t=hq.toLowerCase(),d=o.created?new Date(o.created).toISOString().slice(0,10):"";return(!t||(o.client+" "+o.phone+" "+o.type+" "+rno(o)).toLowerCase().includes(t))&&(!f.e||o.step===f.e)&&(!f.p||(f.p==="s"?rest(o)===0:rest(o)>0))&&(!f.tl||o.tailor===f.tl)&&(!f.a||d>=f.a)&&(!f.b||d<=f.b)};
const resetH=()=>{hfl={e:"",p:"",tl:"",a:"",b:""};hq="";render()};
function printHist(){const L=S.orders.filter(hf).sort((a,b)=>(b.created||0)-(a.created||0));printDoc(`<h2>${esc(S.settings.name)}</h2><p>Historique clients — ${fd(Date.now())}</p><hr><table style="width:100%"><tr><th>N°</th><th>Date</th><th>Client</th><th>Pièce</th><th>Total</th><th>Payé</th><th>Reste</th></tr>${L.map(o=>`<tr><td>${rno(o)}</td><td>${fd(o.created)}</td><td>${esc(o.client)}</td><td>${esc(o.type)}</td><td>${fm(o.price)}</td><td>${fm(paid(o))}</td><td>${fm(rest(o))}</td></tr>`).join("")}</table>`,S.settings.fdoc)}
function sgList(){return `<datalist id="sg">${[...new Set(S.orders.flatMap(o=>[o.client,o.phone].filter(Boolean)))].map(v=>`<option value="${esc(v)}">`).join("")}</datalist>`}
function fillPh(i){const o=S.orders.find(x=>x.client.toLowerCase()===i.value.trim().toLowerCase());if(o&&!i.form.phone.value)i.form.phone.value=o.phone||""}
const FN={"58":"Ticket thermique 58 mm","80":"Ticket thermique 80 mm",a6:"A6 (petit reçu)",a5:"A5 (demi-page)",a4:"A4 (page entière)"};
const PG={"58":["58mm auto","54mm","3mm","11px"],"80":["80mm auto","74mm","3mm","13px"],a6:["A6","105mm","6mm","13px"],a5:["A5","148mm","8mm","14px"],a4:["A4","190mm","10mm","15px"]};
function printDoc(html,f){f=PG[f]?f:"80";const g=PG[f];let r=$("#rcp"),st=$("#pgs");if(!r){r=document.createElement("div");r.id="rcp";document.body.appendChild(r)}if(!st){st=document.createElement("style");st.id="pgs";document.head.appendChild(st)}
  st.textContent=`@page{size:${g[0]};margin:${g[2]}}`;r.style.maxWidth=g[1];r.style.fontSize=g[3];r.innerHTML=`<div class="rc">${html}</div>`;setTimeout(()=>window.print(),80)}
function doReceipt(o,f){const c=S.settings;printDoc(`<h2>${esc(c.name)}</h2><p>${esc(c.addr)}${c.phone?" · "+esc(c.phone):""}</p><hr><table style="width:100%"><tr><td>Reçu n°</td><td class="r"><b>${rno(o)}</b></td></tr><tr><td>Date</td><td class="r">${fd(o.created||Date.now())}</td></tr><tr><td>Client</td><td class="r">${esc(o.client)}</td></tr>${o.phone?`<tr><td>Tél.</td><td class="r">${esc(o.phone)}</td></tr>`:""}<tr><td>Article</td><td class="r">${esc(o.type)}</td></tr><tr><td>Livraison</td><td class="r">${fd(o.due)}</td></tr></table><hr><table style="width:100%"><tr><td>Prix total</td><td class="r"><b>${fm(o.price)}</b></td></tr>${(o.pay||[]).map(p=>`<tr><td>Versé le ${fd(p.d)}</td><td class="r">${fm(p.a)}</td></tr>`).join("")}<tr><td><b>Reste à payer</b></td><td class="r"><b>${fm(rest(o))}</b></td></tr></table><hr>${c.cond?`<p>${esc(c.cond)}</p>`:""}<p><b>${esc(c.foot)}</b></p><br><table style="width:100%"><tr><td>Signature client</td><td class="r">Signature atelier</td></tr></table>`,f||c.fmt)}
function receipt(id,f,auto){const o=S.orders.find(x=>x.id===id);if(!o)return;if(auto)return doReceipt(o,f);
  const t=`Reçu ${rno(o)} — ${S.settings.name}\nClient : ${o.client}\nArticle : ${o.type}\nTotal : ${fm(o.price)}\nPayé : ${fm(paid(o))}\nReste : ${fm(rest(o))}\nLivraison : ${fd(o.due)}\n${S.settings.foot}`;
  modal("🧾 Reçu "+rno(o),`<label>Format d’impression</label><select name="f">${Object.entries(FN).map(([k,v])=>`<option value="${k}"${k===S.settings.fmt?" selected":""}>${v}</option>`).join("")}</select><p style="color:var(--mu);font-size:12px;margin-top:8px">Pour obtenir un fichier, choisissez « Enregistrer au format PDF » dans la fenêtre d’impression.</p>${o.phone?`<p style="margin-top:10px"><a class="btn g s" style="text-decoration:none" target="_blank" href="${wa(o.phone,t)}">💬 Envoyer par WhatsApp</a></p>`:""}`,d=>doReceipt(o,d.f),"🖨 Imprimer")}
const autoPrint=id=>setTimeout(()=>receipt(id,null,1),350);
function drawCl(){$("#clt").innerHTML=V.clientsT()}
function drawHist(){const e=$("#hl");if(!e)return;const L=S.orders.filter(hf).sort((a,b)=>(b.created||0)-(a.created||0));
  e.innerHTML=(anyF()&&L.length?`<button class="btn d s" style="margin-bottom:10px" onclick="delMany()">🗑 Retirer ces ${L.length} entrée(s)</button>`:"")+`<div class="card tw"><table><tr><th>Reçu</th><th>Date</th><th>Client</th><th>Pièce</th><th>Total</th><th>Payé</th><th>Reste</th><th>État</th><th></th></tr>${L.map(o=>`<tr><td>${rno(o)}</td><td>${fd(o.created)}</td><td><b>${esc(o.client)}</b><br><small>${esc(o.phone)}</small></td><td>${esc(o.type)}</td><td>${fm(o.price)}</td><td>${fm(paid(o))}</td><td>${fm(rest(o))}</td><td>${STEPS.find(x=>x[0]===o.step)[1]}</td><td style="white-space:nowrap"><button class="btn g s" onclick="receipt('${o.id}')">🧾</button> <button class="btn g s" onclick="payHist('${o.id}')">💵</button> <button class="btn g s" onclick="delOrder('${o.id}')">🗑</button></td></tr>`).join("")||'<tr><td colspan=9 class="empty">Aucun historique</td></tr>'}</table></div>`}
const delMany=()=>ask("Retirer toutes ces entrées de l’historique ? (un instantané est conservé)",()=>{snapshot(true);mut(()=>{S.orders=S.orders.filter(o=>!hf(o))},"Historique retiré")});
function payHist(id){const o=S.orders.find(x=>x.id===id);modal("Paiements — "+esc(o.client),`${(o.pay||[]).map((p,i)=>`<div class="row" style="justify-content:space-between;margin:6px 0"><span>${fd(p.d)} · <b>${fm(p.a)}</b></span><button type="button" class="btn g s" onclick="delPay('${id}',${i})">🗑</button></div>`).join("")||'<div class="empty">Aucun paiement</div>'}<p style="color:var(--mu);margin-top:8px">Reste à payer : ${fm(rest(o))}</p>`)}
const delPay=(id,i)=>ask("Retirer ce paiement ?",()=>{const o=S.orders.find(x=>x.id===id);snapshot(true);mut(()=>{o.pay.splice(i,1)},"Paiement retiré");document.querySelectorAll(".bg").forEach(b=>b.remove())});
function calcComm(o){const t=S.tailors.find(x=>x.name===o.tailor);if(!t)return 0;return t.mode==="fix"?+t.rate||0:Math.round((+o.price||0)*(+t.rate||0)/100)}
function stamp(o){if((o.step==="pret"||o.step==="livre")&&o.tailor){if(o.comm==null||o.commT!==o.tailor||o.commP!==o.price){o.comm=calcComm(o);o.commT=o.tailor;o.commP=o.price}}else{o.comm=null}}
function tStat(t){const L=S.orders.filter(o=>o.tailor===t.name),fin=L.filter(o=>o.step==="pret"||o.step==="livre"),cur=L.filter(o=>o.step==="rdv"||o.step==="atelier"),gen=fin.reduce((a,o)=>a+(+o.price||0),0),earn=fin.reduce((a,o)=>a+(o.comm||0),0),vers=S.tpay.filter(p=>p.t===t.name).reduce((a,p)=>a+p.a,0);return{L,fin,cur,gen,earn,vers,solde:earn-vers}}
function finK(){const O=S.orders,ca=O.reduce((a,o)=>a+(+o.price||0),0),enc=O.reduce((a,o)=>a+paid(o),0),dep=S.expenses.reduce((a,e)=>a+e.a,0),tp=S.tpay.reduce((a,p)=>a+p.a,0),due=S.tailors.reduce((a,t)=>a+Math.max(0,tStat(t).solde),0);return[["Chiffre d’affaires",fm(ca)],["Encaissé",fm(enc)],["Reste à encaisser",fm(ca-enc)],["Dépenses",fm(dep)],["Versé aux tailleurs",fm(tp)],["Dû aux tailleurs",fm(due)],["Bénéfice net",fm(enc-dep-tp)]]}
function finTop(){return `<div class="grid">${finK().map(k=>`<div class="card kpi"><small>${k[0]}</small><div>${k[1]}</div></div>`).join("")}</div><p style="color:var(--mu);font-size:12px;margin:-8px 0 16px">Bénéfice net = encaissé − dépenses − versements aux tailleurs. Le gain d’un tailleur est fixé quand la pièce passe « Prêt en boutique ».</p>`}
const printFin=()=>printDoc(`<h2>${esc(S.settings.name)}</h2><p>Rapport financier — ${fd(Date.now())}</p><hr><table style="width:100%">${finK().map(k=>`<tr><td>${k[0]}</td><td class="r"><b>${k[1]}</b></td></tr>`).join("")}</table><hr><table style="width:100%"><tr><th>Tailleur</th><th>Terminées</th><th>Gains</th><th>Versé</th><th>Solde</th></tr>${S.tailors.map(t=>{const s=tStat(t);return `<tr><td>${esc(t.name)}</td><td>${s.fin.length}</td><td>${fm(s.earn)}</td><td>${fm(s.vers)}</td><td>${fm(s.solde)}</td></tr>`}).join("")}</table>`,S.settings.fdoc);
function finTailors(){return `<div class="top"><h3>✂ Tailleurs — travail & rémunération</h3><div class="row"><button class="btn g s" onclick="printFin()">🖨 Rapport</button><button class="btn s" onclick="addTailor()">+ Tailleur</button></div></div><div class="card tw"><table><tr><th>Tailleur</th><th>Barème</th><th>Attribuées</th><th>En cours</th><th>Terminées</th><th>CA généré</th><th>Gains</th><th>Versé</th><th>Solde dû</th><th></th></tr>${S.tailors.map(t=>{const s=tStat(t);return `<tr><td><b>${esc(t.name)}</b></td><td>${t.mode==="fix"?fm(t.rate)+"/pièce":(t.rate||0)+" %"}</td><td>${s.L.length}</td><td>${s.cur.length}</td><td>${s.fin.length}</td><td>${fm(s.gen)}</td><td>${fm(s.earn)}</td><td>${fm(s.vers)}</td><td><b style="color:${s.solde>0?"var(--er)":"var(--ok)"}">${fm(s.solde)}</b></td><td style="white-space:nowrap"><button class="btn s" onclick="tDetail('${t.id}')">Détail</button></td></tr>`}).join("")||'<tr><td colspan=10 class="empty">Ajoutez vos tailleurs pour suivre leur travail</td></tr>'}</table></div><div style="height:18px"></div>`}
function tDetail(id){const t=S.tailors.find(x=>x.id===id),s=tStat(t),P=S.tpay.filter(p=>p.t===t.name);
  modal("✂ "+esc(t.name),`<p style="color:var(--mu)">Barème : ${t.mode==="fix"?fm(t.rate)+" par pièce":(t.rate||0)+" % du prix"}</p><div class="grid" style="margin:10px 0">${[["Attribuées",s.L.length],["En cours",s.cur.length],["Terminées",s.fin.length],["CA généré",fm(s.gen)],["Gains",fm(s.earn)],["Déjà versé",fm(s.vers)],["Solde dû",fm(s.solde)]].map(k=>`<div class="card kpi" style="padding:9px"><small>${k[0]}</small><div style="font-size:17px">${k[1]}</div></div>`).join("")}</div>
  <div class="row" style="margin-bottom:12px"><button type="button" class="btn s" onclick="tPay('${id}')">💵 Verser</button><button type="button" class="btn g s" onclick="tSheet('${id}')">🖨 Imprimer le relevé</button></div>
  <h4 style="margin-bottom:4px">Commandes attribuées</h4><div class="tw"><table><tr><th>N°</th><th>Pièce / client</th><th>Livraison</th><th>État</th><th>Prix</th><th>Gain</th></tr>${s.L.map(o=>`<tr><td>${rno(o)}</td><td>${esc(o.type)}<br><small>${esc(o.client)}</small></td><td>${fd(o.due)}${late(o)?" ⚠":""}</td><td>${STEPS.find(x=>x[0]===o.step)[1]}</td><td>${fm(o.price)}</td><td>${o.comm!=null?fm(o.comm):"—"}</td></tr>`).join("")||'<tr><td colspan=6 class="empty">Aucune commande attribuée</td></tr>'}</table></div>
  <h4 style="margin:14px 0 4px">Versements</h4>${P.map(p=>`<div class="row" style="justify-content:space-between;margin:4px 0"><span>${fd(p.d)} · <b>${fm(p.a)}</b> ${esc(p.n||"")}</span><span><button type="button" class="btn g s" onclick="tSlip('${p.id}')">🖨</button> <button type="button" class="btn g s" onclick="delTpay('${p.id}')">🗑</button></span></div>`).join("")||'<div class="empty">Aucun versement</div>'}`)}
function tSheet(id){const t=S.tailors.find(x=>x.id===id),s=tStat(t);printDoc(`<h2>${esc(S.settings.name)}</h2><p>Relevé du tailleur ${esc(t.name)} — ${fd(Date.now())}</p><hr><table style="width:100%"><tr><th>N°</th><th>Pièce</th><th>Client</th><th>État</th><th>Prix</th><th>Gain</th></tr>${s.L.map(o=>`<tr><td>${rno(o)}</td><td>${esc(o.type)}</td><td>${esc(o.client)}</td><td>${STEPS.find(x=>x[0]===o.step)[1]}</td><td>${fm(o.price)}</td><td>${o.comm!=null?fm(o.comm):"—"}</td></tr>`).join("")}</table><hr><table style="width:100%"><tr><td>CA généré</td><td class="r">${fm(s.gen)}</td></tr><tr><td>Gains</td><td class="r">${fm(s.earn)}</td></tr><tr><td>Déjà versé</td><td class="r">${fm(s.vers)}</td></tr><tr><td><b>Solde dû</b></td><td class="r"><b>${fm(s.solde)}</b></td></tr></table>`,S.settings.fdoc)}
function tPay(id){const t=S.tailors.find(x=>x.id===id),s=tStat(t);modal("Verser à "+esc(t.name),`<p style="color:var(--mu)">Solde dû : ${fm(s.solde)}</p><label>Montant</label><input name="a" type="number" min="1" required value="${s.solde>0?s.solde:""}"><label>Note (avance, solde du mois…)</label><input name="n">`,d=>{const p={id:uid(),t:t.name,a:+d.a,d:today(),n:d.n};mut(()=>S.tpay.push(p),"Versement enregistré ✓");document.querySelectorAll(".bg").forEach(b=>b.remove());if(S.settings.apTp)setTimeout(()=>tSlip(p.id),350)},"Verser")}
function tSlip(pid){const p=S.tpay.find(x=>x.id===pid),t=p&&S.tailors.find(x=>x.name===p.t);if(!t)return;const s=tStat(t);printDoc(`<h2>${esc(S.settings.name)}</h2><p>Reçu de versement — tailleur</p><hr><table style="width:100%"><tr><td>Tailleur</td><td class="r"><b>${esc(p.t)}</b></td></tr><tr><td>Date</td><td class="r">${fd(p.d)}</td></tr><tr><td>Montant versé</td><td class="r"><b>${fm(p.a)}</b></td></tr>${p.n?`<tr><td>Note</td><td class="r">${esc(p.n)}</td></tr>`:""}<tr><td>Gains cumulés</td><td class="r">${fm(s.earn)}</td></tr><tr><td>Total versé</td><td class="r">${fm(s.vers)}</td></tr><tr><td><b>Solde restant</b></td><td class="r"><b>${fm(s.solde)}</b></td></tr></table><hr><br><table style="width:100%"><tr><td>Signature tailleur</td><td class="r">Signature atelier</td></tr></table>`,S.settings.fmt)}
const delTpay=id=>ask("Retirer ce versement ?",()=>{snapshot(true);mut(()=>{S.tpay=S.tpay.filter(p=>p.id!==id)},"Versement retiré");document.querySelectorAll(".bg").forEach(b=>b.remove())});
function paramTop(){const s=S.settings,ck=(n,l)=>`<label style="display:flex;gap:8px;align-items:center;color:var(--tx);font-size:14px;margin:6px 0"><input type="checkbox" name="${n}" style="width:auto"${s[n]?" checked":""}>${l}</label>`,fo=v=>Object.entries(FN).map(([k,l])=>`<option value="${k}"${k===v?" selected":""}>${l}</option>`).join("");
  return `<form class="card" onsubmit="saveSet(event)" style="margin-bottom:16px"><h3>🏪 Atelier & reçus</h3><label>Nom de l’atelier</label><input name="name" value="${esc(s.name)}"><div class="two"><div><label>Téléphone</label><input name="phone" value="${esc(s.phone)}"></div><div><label>Devise</label><input name="cur" value="${esc(s.cur)}"></div></div><label>Adresse</label><input name="addr" value="${esc(s.addr)}"><label>Message en bas des reçus</label><input name="foot" value="${esc(s.foot)}"><label>Conditions affichées sur le reçu</label><textarea name="cond" rows="2">${esc(s.cond)}</textarea>
  <h3 style="margin-top:18px">🖨 Impression</h3><div class="two"><div><label>Format des reçus</label><select name="fmt">${fo(s.fmt)}</select></div><div><label>Format des documents (relevés, listes, rapports)</label><select name="fdoc">${fo(s.fdoc)}</select></div></div><label style="margin-top:12px">Ouvrir automatiquement l’impression :</label>${ck("apNew","à la création d’une commande")}${ck("apPay","à chaque paiement encaissé")}${ck("apDel","à la livraison (reçu final)")}${ck("apTp","à chaque versement à un tailleur")}<p style="color:var(--mu);font-size:12px;margin-top:6px">Une page web ne peut pas imprimer sans afficher la fenêtre d’impression. Pour une impression 100 % silencieuse sur un PC de caisse, lancez Chrome avec l’option <code>--kiosk-printing</code>.</p>
  <h3 style="margin-top:18px">✂ Rémunération des tailleurs (valeur par défaut)</h3><div class="two"><div><label>Mode</label><select name="mode"><option value="pct"${s.mode==="pct"?" selected":""}>% du prix</option><option value="fix"${s.mode==="fix"?" selected":""}>Montant fixe / pièce</option></select></div><div><label>Valeur</label><input name="rate" type="number" min="0" value="${s.rate}"></div></div><button class="btn" style="margin-top:14px">Enregistrer</button></form>
  <a href="#securite" class="card" style="display:block;text-decoration:none;color:inherit;margin-bottom:22px"><div class="row" style="justify-content:space-between;margin:0"><div><h3>🔒 Sécurité</h3><p style="color:var(--mu);margin-top:4px">Mot de passe : ${s.pwh?"activé":"non défini"} · 2FA : ${s.tfa?"activée":"désactivée"}</p></div><span class="pill">Ouvrir ›</span></div></a>`}
async function hsh(x){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("sw:"+x));return[...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,"0")).join("")}
function setPw(){modal("Mot de passe",`${S.settings.pwh?'<label>Mot de passe actuel</label><input name="o" type="password" required>':""}<label>Nouveau mot de passe (4 caractères min.)</label><input name="p" type="password" minlength="4" required><p style="color:var(--mu);font-size:12px;margin-top:8px">Notez-le bien : il n’est pas récupérable.</p>`,d=>{(async()=>{if(S.settings.pwh&&await hsh(d.o)!==S.settings.pwh)return toast("Mot de passe actuel incorrect");const h=await hsh(d.p);mut(()=>{S.settings.pwh=h},"Mot de passe activé 🔒")})()})}
function rmPw(){modal("Désactiver le mot de passe",`<label>Mot de passe actuel</label><input name="o" type="password" required>`,d=>{(async()=>{if(await hsh(d.o)!==S.settings.pwh)return toast("Mot de passe incorrect");mut(()=>{S.settings.pwh="";S.settings.tfa="";S.settings.tbk=[]},"Mot de passe retiré")})()},"Désactiver")}
const B32="ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
const b32e=u=>{let b=0,v=0,o="";for(const x of u){v=(v<<8)|x;b+=8;while(b>=5){o+=B32[(v>>>(b-5))&31];b-=5}}if(b)o+=B32[(v<<(5-b))&31];return o};
const b32d=t=>{let b=0,v=0;const o=[];for(const c of t){v=(v<<5)|B32.indexOf(c);b+=5;if(b>=8){o.push((v>>>(b-8))&255);b-=8}}return new Uint8Array(o)};
async function totp(sec,off=0){let x=Math.floor(Date.now()/3e4)+off;const m=new Uint8Array(8);for(let i=7;i>=0;i--){m[i]=x&255;x=Math.floor(x/256)}const k=await crypto.subtle.importKey("raw",b32d(sec),{name:"HMAC",hash:"SHA-1"},false,["sign"]),h=new Uint8Array(await crypto.subtle.sign("HMAC",k,m)),o=h[19]&15;return String((((h[o]&127)<<24)|(h[o+1]<<16)|(h[o+2]<<8)|h[o+3])%1e6).padStart(6,"0")}
const chk=async(sec,c)=>{c=String(c).replace(/\s/g,"");for(const o of[-1,0,1])if(await totp(sec,o)===c)return true;return false};
const rc=()=>{const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";return[...crypto.getRandomValues(new Uint8Array(8))].map(x=>A[x%A.length]).join("").replace(/(.{4})/,"$1-")};
function lock(){if($("#lk"))return;const bg=document.createElement("div");bg.id="lk";bg.className="bg";bg.style.cssText="background:var(--bg);z-index:999";let step=1;
  const draw=()=>{bg.innerHTML=`<form class="md" style="text-align:center;max-width:380px"><div class="mono" style="margin:0 auto 10px">SW</div><h3>${esc(S.settings.name)}</h3><p style="color:var(--mu)">${step===1?"Application verrouillée":"Vérification en deux étapes<br>Code à 6 chiffres de votre application, ou code de secours"}</p><input id="lp" type="${step===1?"password":"text"}" ${step===2?'inputmode="numeric" autocomplete="one-time-code"':""} placeholder="${step===1?"Mot de passe":"Code"}" style="margin:14px 0"><button class="btn" style="width:100%">${step===1?"Déverrouiller":"Vérifier"}</button></form>`;$("#lp").focus();
    bg.firstChild.onsubmit=async e=>{e.preventDefault();const v=$("#lp").value;let good=false;
      if(step===1){good=await hsh(v)===S.settings.pwh;if(good&&S.settings.tfa){step=2;return draw()}}
      else{good=await chk(S.settings.tfa,v);if(!good){const i=S.settings.tbk.indexOf(await hsh("bk:"+v.trim().toUpperCase()));if(i>=0){good=true;S.settings.tbk.splice(i,1);persist()}}}
      if(good)bg.remove();else{toast("Code ou mot de passe incorrect");$("#lp").value=""}}};
  document.body.appendChild(bg);draw()}
function needPw(t,fn){modal(t,`<label>Mot de passe actuel</label><input name="o" type="password" required>`,d=>{(async()=>{if(await hsh(d.o)!==S.settings.pwh)return toast("Mot de passe incorrect");document.querySelectorAll(".bg").forEach(b=>b.remove());fn()})();return false},"Confirmer")}
function showCodes(c){modal("🔐 Codes de secours",`<p style="color:var(--mu)">Notez-les maintenant, en lieu sûr. Chaque code ne sert qu’une fois si vous perdez votre téléphone. Ils ne seront plus affichés.</p><div class="grid" style="margin-top:10px">${c.map(x=>`<div class="card" style="font:700 16px monospace;text-align:center">${x}</div>`).join("")}</div>`)}
async function newCodes(){const c=Array.from({length:8},rc),h=await Promise.all(c.map(x=>hsh("bk:"+x)));mut(()=>{S.settings.tbk=h},"Codes régénérés");showCodes(c)}
const tfaOff=()=>mut(()=>{S.settings.tfa="";S.settings.tbk=[]},"2FA désactivée");
function tfaOn(){if(!S.settings.pwh)return toast("Définissez d’abord un mot de passe");const sec=b32e(crypto.getRandomValues(new Uint8Array(20))),n=encodeURIComponent(S.settings.name),uri=`otpauth://totp/${n}:Admin?secret=${sec}&issuer=${n}`;
  modal("Activer la 2FA — application",`<p style="color:var(--mu);margin:6px 0">1. Dans Google Authenticator, Microsoft Authenticator ou Authy, ajoutez un compte avec cette clé (saisie manuelle) :</p><div class="card" style="font:700 17px monospace;letter-spacing:2px;text-align:center;word-break:break-all">${sec.match(/.{1,4}/g).join(" ")}</div><p style="margin:8px 0"><a href="${uri}">📲 Ouvrir directement dans l’application</a></p><p style="color:var(--mu)">2. Saisissez le code à 6 chiffres affiché :</p><input name="c" inputmode="numeric" maxlength="7" required>`,
  d=>{(async()=>{if(!await chk(sec,d.c))return toast("Code incorrect, réessayez");const codes=Array.from({length:8},rc),hs=await Promise.all(codes.map(c=>hsh("bk:"+c)));mut(()=>{S.settings.tfa=sec;S.settings.tbk=hs},"2FA activée ✓");document.querySelectorAll(".bg").forEach(b=>b.remove());showCodes(codes)})();return false},"Activer")}
function secView(){const s=S.settings,on=!!s.pwh,t2=!!s.tfa;
  return `<a href="#parametres" class="btn g s" style="text-decoration:none">‹ Paramètres</a>
<div class="card" style="margin:14px 0"><h3>🔑 Mot de passe</h3><p style="color:var(--mu);margin:6px 0 10px">${on?"Activé — demandé à chaque ouverture.":"Aucun mot de passe : accès libre."}</p><div class="row"><button class="btn" onclick="setPw()">${on?"Changer le mot de passe":"Définir un mot de passe"}</button>${on?`<button class="btn g" onclick="lock()">Verrouiller maintenant</button><button class="btn g" onclick="rmPw()">Désactiver</button>`:""}</div></div>
<div class="card" style="margin-bottom:14px"><h3>🛡 Vérification en deux étapes (2FA)</h3><p style="color:var(--mu);margin:6px 0 12px">${t2?"✅ Activée — un code est demandé après le mot de passe.":"Choisissez comment recevoir votre code de vérification :"}</p>
${[["📱","Application d’authentification","Google Authenticator, Microsoft Authenticator, Authy… Fonctionne sans internet. Recommandé.",1],["💬","WhatsApp","Code envoyé sur votre WhatsApp",0],["📩","SMS","Code envoyé par SMS",0],["✉️","E-mail","Code envoyé par e-mail",0]].map(c=>`<div class="row" style="justify-content:space-between;border:1px solid var(--ln);border-radius:12px;padding:10px;margin:0 0 8px"><div style="flex:1;min-width:200px"><b>${c[0]} ${c[1]}</b><br><small style="color:var(--mu)">${c[2]}</small></div>${c[3]?(t2?`<span class="pill ok">Actif</span>`:`<button class="btn s" onclick="tfaOn()">Activer</button>`):`<span class="pill wr">Nécessite un serveur</span>`}</div>`).join("")}
${t2?`<div class="row"><button class="btn g s" onclick="needPw('Nouveaux codes de secours',newCodes)">Régénérer les codes de secours (${s.tbk.length} restants)</button><button class="btn g s" onclick="needPw('Désactiver la 2FA',tfaOff)">Désactiver la 2FA</button></div>`:""}
<p style="color:var(--mu);font-size:12px;margin-top:10px">WhatsApp, SMS et e-mail ne sont pas actifs : ils exigent un serveur qui envoie le message. Un code généré et affiché sur le même appareil n’apporterait aucune sécurité. Ils pourront être branchés avec Firebase. L’horloge du téléphone doit être à l’heure.</p></div>
<div class="card"><h3>⏱ Verrouillage automatique</h3><label>Verrouiller après inactivité</label><select onchange="mut(()=>{S.settings.lockMin=+this.value},'Enregistré ✓')">${[[0,"Jamais"],[1,"1 minute"],[5,"5 minutes"],[15,"15 minutes"],[60,"1 heure"]].map(m=>`<option value="${m[0]}"${+s.lockMin===m[0]?" selected":""}>${m[1]}</option>`).join("")}</select>${on?"":'<p style="color:var(--mu);font-size:12px;margin-top:6px">Nécessite un mot de passe.</p>'}</div>`}
let idle;const bump=()=>{clearTimeout(idle);const m=+S.settings.lockMin;if(m&&S.settings.pwh)idle=setTimeout(lock,m*6e4)};
["click","keydown","touchstart"].forEach(e=>addEventListener(e,bump,{passive:true}));

/* ===== ROUTEUR ===== */
function render(){const h=(location.hash||"#dashboard").slice(1),v=VIEWS.some(x=>x[0]===h)?h:"dashboard",t=VIEWS.find(x=>x[0]===v)[2];
  $("#nav").innerHTML=`<div class="brand"><img class="mono" src="assets/img/logo-128.png" alt="SW" style="object-fit:cover"><div><b>Sarkin Wanka</b><br><small>Fashion Design · Niamey</small></div></div>`+VIEWS.filter(x=>!x[3]).map(x=>`<a href="#${x[0]}" class="${x[0]===v||(v==="securite"&&x[0]==="parametres")?"on":""}"><span>${x[1]}</span>${x[2]}</a>`).join("");
  $("#app").innerHTML=`<div class="top"><h2>${t}</h2><div class="row">${v==="commandes"||v==="dashboard"?'<button class="btn" onclick="orderForm()">+ Nouvelle commande</button>':""}<span id="st" class="pill"></span></div></div>`+V[v]();stat();
  if(v==="commandes"){drawKan();$("#q").oninput=e=>{q=e.target.value;drawKan()}}if(v==="clients"){drawCl();$("#qc").oninput=e=>{qc=e.target.value.toLowerCase();drawCl()}}if(v==="historique"){drawHist();document.querySelectorAll(".hf").forEach(e=>e.onchange=()=>{hfl[e.name]=e.value;drawHist()});$("#qh").oninput=e=>{hq=e.target.value;drawHist()}}if(v==="parametres")drawSnaps();bump()}
addEventListener("hashchange",render);load();
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
