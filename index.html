<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sarkin Wanka — Gestion d’atelier</title>
<meta name="theme-color" content="#a67c00"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Sarkin Wanka">
<link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" href="assets/img/icon-192.png"><link rel="apple-touch-icon" href="assets/img/icon-192.png">
<style>
:root{--bg:#f7f3ea;--card:#fff;--tx:#201a0e;--mu:#7a705c;--ln:#e6dcc3;--gd:#a67c00;--gl:#f3e6bd;--ok:#2f8f5b;--wr:#d98a00;--er:#c8412d;--sb:#1d1809;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14110a;--card:#1f1a0f;--tx:#f3ecd9;--mu:#a99d82;--ln:#352d1a;--gl:#3a2f10;--sb:#0d0b06;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14110a;--card:#1f1a0f;--tx:#f3ecd9;--mu:#a99d82;--ln:#352d1a;--gl:#3a2f10;--sb:#0d0b06;color-scheme:dark}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:700}
nav{width:220px;background:var(--sb);color:#e9dfc2;padding:20px 12px;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:18px;padding:0 6px}
.mono{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#a67c00,#e0b83a);display:grid;place-items:center;color:#1d1809;font:700 16px Georgia,serif;flex-shrink:0}
.brand b{font:700 15px Georgia,serif;line-height:1.1}.brand small{color:#a99d82;font-size:11px}
nav a{color:inherit;text-decoration:none;padding:10px 12px;border-radius:10px;display:flex;gap:10px;align-items:center;font-weight:500}
nav a.on{background:var(--gd);color:#fff}nav a:hover:not(.on){background:#2b2412}
main{flex:1;overflow-y:auto;padding:22px 26px 40px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.top h2{font-size:26px}
.toplogo{display:none;width:34px;height:34px;border-radius:50%;margin-right:8px;vertical-align:middle}
@media(max-width:760px){.toplogo{display:inline-block}}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--gl);color:var(--gd);font-weight:600;white-space:nowrap}
.pill.ok{background:#dff3e7;color:var(--ok)}.pill.er{background:#fbe1dc;color:var(--er)}.pill.wr{background:#fdeccb;color:#a66a00}
.btn{border:0;background:var(--gd);color:#fff;padding:9px 15px;border-radius:10px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--ln)}.btn.d{background:var(--er)}.btn.s{padding:5px 9px;font-size:13px}
.btn:active{transform:scale(.97)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px}
.kpi small{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.5px}.kpi div{font:700 22px Georgia,serif;margin-top:4px}
.kan{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:12px;overflow-x:auto;padding-bottom:10px}
.col{background:color-mix(in srgb,var(--ln) 35%,transparent);border-radius:14px;padding:10px;min-height:120px}
.col h3{font-size:15px;margin:2px 4px 10px;display:flex;justify-content:space-between}
.o{background:var(--card);border:1px solid var(--ln);border-left:4px solid var(--gd);border-radius:12px;padding:11px;margin-bottom:9px}
.o.late{border-left-color:var(--er)}.o h4{font-size:15px}.o p{color:var(--mu);font-size:13px;margin-top:2px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:center}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px 8px;border-bottom:1px solid var(--ln);font-size:14px}th{color:var(--mu);font-size:12px;text-transform:uppercase}
.tw{overflow-x:auto}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--ln);border-radius:9px;background:var(--bg);color:var(--tx);font:16px inherit;font-family:inherit}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px;font-weight:600}
.bg{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:14px;z-index:50}
.md{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:640px;max-height:92%;overflow-y:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--sb);color:#fff;padding:10px 16px;border-radius:99px;z-index:99;font-size:14px}
.empty{color:var(--mu);text-align:center;padding:18px;font-size:14px}
#rcp{display:none}
@media print{body>*:not(#rcp){display:none!important}#rcp{display:block;color:#000;background:#fff;font:14px/1.5 system-ui,sans-serif;max-width:380px;margin:0 auto;padding:10px}}
.rc h2{text-align:center;font-size:20px}.rc p{text-align:center;font-size:12px}.rc hr{border:0;border-top:1px dashed #000;margin:10px 0}.rc td{padding:3px 0;border:0;font-size:inherit}.rc th{color:#000;font-size:inherit;border-bottom:1px solid #000;padding:3px 4px 3px 0}.rc .r{text-align:right}
.ban{background:#fbe1dc;color:var(--er);padding:10px 14px;border-radius:12px;margin-bottom:14px;font-weight:600}
@media(max-width:760px){body{flex-direction:column-reverse}
nav{width:100%;flex-direction:row;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;position:fixed;bottom:0;left:0;z-index:20}
.brand{display:none}nav a{flex-direction:column;gap:1px;font-size:10px;padding:6px 4px}nav a span{font-size:19px}
main{padding:16px 14px 90px}.top h2{font-size:22px}}
</style></head><body>
<nav id="nav"></nav><main id="app"></main>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
const STEPS=[["rdv","Rendez-vous"],["atelier","En atelier"],["pret","Prêt en boutique"],["livre","Livré"]];
const APP_VER="4.1.0";
const UPD_URL="https://sarkin-wanka-71b0d.web.app/update/";
const VIEWS=[["dashboard","📊","Tableau de bord"],["commandes","🧵","Commandes"],["clients","👤","Clients"],["historique","📜","Historique"],["atelier","✂️","Atelier"],["finances","💰","Finances"],["parametres","⚙️","Paramètres"],["securite","🔒","Sécurité",1]];
const blank=()=>({orders:[],tailors:[],tpay:[],stock:[],expenses:[],meas:{},settings:{name:"Sarkin Wanka Fashion Design",phone:"",cur:"FCFA",addr:"Niamey, Niger",foot:"Merci de votre confiance !",cond:"Tout vêtement non retiré sous {jours} jours n’est plus sous la responsabilité de l’atelier.",mode:"pct",rate:30,pwh:"",fmt:"80",fdoc:"a4",apNew:true,apPay:true,apDel:true,apTp:true,lockMin:0,tfa:"",tbk:[],pin2:"",phone2:"",wa:"",fb:"",nif:"",logoOn:true,logo:"",pfx:"R-",pad:4,modes:"Espèces, Airtel Money, Orange Money, Moov Money, Virement",bkDays:7,retDays:30,wPret:"Bonjour {client}, votre {type} est prêt chez {atelier}.{reste}",wRel:"Bonjour {client}, ici {atelier}."},meta:{lastSnap:0,lastExport:0,n:0,no:0}});
const norm=d=>{const b=blank();d=Object.assign(b,d);d.settings={...blank().settings,...d.settings};d.meta={...blank().meta,...d.meta};let m=d.meta.no||0;d.orders.filter(o=>!o.no).sort((a,b)=>(a.created||0)-(b.created||0)).forEach(o=>o.no=++m);d.meta.no=m;d.meas=d.meas||{};d.orders.forEach(o=>{if(o.step==="pret"&&!o.readyAt)o.readyAt=Date.now()});return d};
let S=blank(),q="",qc="",hq="",hfl={e:"",p:"",tl:"",a:"",b:""},_new=null,ok=true;
const fm=n=>(+n||0).toLocaleString("fr-FR")+" "+S.settings.cur;
const paid=o=>(o.pay||[]).reduce((a,p)=>a+p.a,0);
const rest=o=>Math.max(0,(+o.price||0)-paid(o));
const late=o=>o.step!=="livre"&&o.due&&o.due<today();
const wa=(p,m)=>"https://wa.me/"+String(p||"").replace(/\D/g,"")+"?text="+encodeURIComponent(m);
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)}

/* ===== PONT ANDROID (APK) : sauvegarde, partage, impression ===== */
const NATIVE=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
const NP=n=>window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins[n];
async function saveFile(name,text,mime){
  if(NATIVE&&NP("Filesystem")&&NP("Share")){
    const r=await NP("Filesystem").writeFile({path:name,data:text,directory:"CACHE",encoding:"utf8"});
    await NP("Share").share({title:name,dialogTitle:"Enregistrer ou envoyer la sauvegarde",url:r.uri});
    return}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;a.click()}
function doPrint(){if(NATIVE&&NP("NativePrint"))NP("NativePrint").print({name:"Sarkin Wanka"}).catch(e=>toast("Impression impossible"));else window.print()}

/* ===== STOCKAGE ROBUSTE : IndexedDB + copie localStorage + instantanés ===== */
const idb=new Promise((res,rej)=>{const r=indexedDB.open("sarkin-wanka",1);r.onupgradeneeded=()=>{r.result.createObjectStore("kv");r.result.createObjectStore("snaps")};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function tx(st,mode,fn){const d=await idb;return new Promise((res,rej)=>{const t=d.transaction(st,mode);const rq=fn(t.objectStore(st));t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
let chain=Promise.resolve();
function persist(){ // écritures sérialisées : aucune sauvegarde ne se perd ni ne s’entrecroise
  const json=JSON.stringify(S);
  try{localStorage.setItem("sw_mirror",json)}catch(e){}
  chain=chain.then(async()=>{try{await tx("kv","readwrite",s=>s.put(json,"db"));ok=true}catch(e){ok=false}stat()});
  return chain}
async function snapshot(force){
  const now=Date.now();if(!force&&now-S.meta.lastSnap<36e5)return;
  S.meta.lastSnap=now;const json=JSON.stringify(S);
  try{await tx("snaps","readwrite",s=>s.put(json,now));const ks=await tx("snaps","readonly",s=>s.getAllKeys());
  if(ks.length>20)await tx("snaps","readwrite",s=>{ks.sort((a,b)=>a-b).slice(0,ks.length-20).forEach(k=>s.delete(k))})}catch(e){}}
function mut(fn,msg){fn();S.meta.n++;persist();snapshot(S.meta.n%25===0);render();if(msg)toast(msg)}
function stat(){const e=$("#st");if(e){e.className="pill "+(ok?"ok":"er");e.textContent=ok?"✓ Enregistré":"⚠ Erreur d’enregistrement"}}
async function load(){
  let raw=null;try{raw=await tx("kv","readonly",s=>s.get("db"))}catch(e){}
  if(!raw)raw=localStorage.getItem("sw_mirror");
  if(raw){try{S=norm(JSON.parse(raw))}catch(e){toast("Données illisibles — restaurez un instantané")}}
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
  ROLE=S.settings.pwh?"staff":"boss";render();if(S.settings.pwh)lock();bootUpdate()}
addEventListener("pagehide",()=>persist());
document.addEventListener("visibilitychange",()=>{if(document.hidden)persist()});

/* ===== FENÊTRES ===== */
function modal(title,html,onOk,okLabel){
  const bg=document.createElement("div");bg.className="bg";
  bg.innerHTML=`<form class="md"><h3 style="margin-bottom:6px">${title}</h3>${html}<div class="row" style="margin-top:16px;justify-content:flex-end"><button type="button" class="btn g" data-x>${onOk?"Annuler":"Fermer"}</button>${onOk?`<button class="btn">${okLabel||"Enregistrer"}</button>`:""}</div></form>`;
  document.body.appendChild(bg);const f=bg.firstChild;
  bg.querySelector("[data-x]").onclick=()=>bg.remove();
  f.onsubmit=e=>{e.preventDefault();if(onOk&&onOk(Object.fromEntries(new FormData(f)))!==false)bg.remove()};
  const i=f.querySelector("input,select");if(i&&!/Mobi/.test(navigator.userAgent))i.focus()}
const ask=(msg,fn)=>modal("Confirmation",`<p style="margin-top:8px">${msg}</p>`,()=>{fn()},"Confirmer");

/* ===== COMMANDES ===== */
function orderForm(o){
  const n=!o;o=o||{step:"rdv",due:today()};
  modal(n?"Nouvelle commande":"Modifier la commande",`
  <label>Client</label><input name="client" required value="${esc(o.client)}" list="cl" oninput="fillPh(this)">
  <datalist id="cl">${[...new Set(S.orders.map(x=>x.client))].map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
  <div class="two"><div><label>Téléphone / WhatsApp</label><input name="phone" type="tel" value="${esc(o.phone)}"></div>
  <div><label>Vêtement</label><input name="type" required value="${esc(o.type)}"></div></div>
  <div class="two"><div><label>Prix (${S.settings.cur})</label><input name="price" type="number" min="0" value="${o.price||""}"></div>
  ${n?`<div><label>Acompte versé</label><input name="dep" type="number" min="0"></div>`:`<div><label>Déjà payé</label><input disabled value="${fm(paid(o))}"></div>`}</div>
  ${n?`<label>Mode de paiement de l’acompte</label>${modeSel("dm")}`:""}
  <div class="two"><div><label>Date de livraison</label><input name="due" type="date" value="${esc(o.due)}"></div>
  <div><label>Étape</label><select name="step">${STEPS.map(s=>`<option value="${s[0]}"${o.step===s[0]?" selected":""}>${s[1]}</option>`).join("")}</select></div></div>
  <label>Tailleur</label><select name="tailor"><option value="">— Non assigné —</option>${S.tailors.map(t=>`<option${o.tailor===t.name?" selected":""}>${esc(t.name)}</option>`).join("")}</select>
  <label>Mesures & notes (fiche détaillée : Clients → 📏)</label><textarea name="notes" rows="3">${esc(o.notes)}</textarea>`,
  d=>{mut(()=>{const base={client:d.client.trim(),phone:d.phone.trim(),type:d.type.trim(),price:+d.price||0,due:d.due,step:d.step,tailor:d.tailor,notes:d.notes.trim()};
    if(n){const x={id:uid(),no:++S.meta.no,created:Date.now(),pay:+d.dep>0?[{d:today(),a:+d.dep,m:d.dm}]:[],...base};stamp(x);_new=x.id;S.orders.push(x)}else{Object.assign(o,base);stamp(o)}},n?"Commande enregistrée ✓":"Modifiée ✓");if(n&&_new&&S.settings.apNew){autoPrint(_new);_new=null}})}
function pay(id){const o=S.orders.find(x=>x.id===id);
  modal("Encaisser un paiement",`<p style="color:var(--mu)">${esc(o.client)} — reste ${fm(rest(o))}</p><label>Montant</label><input name="a" type="number" min="1" required value="${rest(o)||""}"><label>Mode de paiement</label>${modeSel("m")}`,
  d=>{mut(()=>{(o.pay=o.pay||[]).push({d:today(),a:+d.a,m:d.m})},"Paiement enregistré ✓");if(S.settings.apPay)autoPrint(o.id)},"Encaisser")}
function move(id,dir){const o=S.orders.find(x=>x.id===id),i=STEPS.findIndex(s=>s[0]===o.step)+dir;if(i<0||i>3)return;
  const go=()=>{mut(()=>{o.step=STEPS[i][0];stamp(o)},"→ "+STEPS[i][1]);if(STEPS[i][0]==="livre"&&S.settings.apDel)autoPrint(o.id)};
  if(STEPS[i][0]==="livre"&&rest(o)>0)ask(`Il reste ${fm(rest(o))} à payer. Livrer quand même ?`,go);else go()}
const delOrder=id=>ask("Supprimer cette commande ? (un instantané est conservé)",()=>{snapshot(true);mut(()=>{S.orders=S.orders.filter(x=>x.id!==id)},"Supprimée")});
const editOrder=id=>orderForm(S.orders.find(x=>x.id===id));
function card(o){const r=rest(o);return `<div class="o${late(o)?" late":""}"><h4>${esc(o.client)}</h4><p>${esc(o.type)}${o.tailor?" · ✂ "+esc(o.tailor):""}</p>
<p>${late(o)?"<b style='color:var(--er)'>En retard · </b>":""}📅 ${o.due?new Date(o.due).toLocaleDateString("fr-FR"):"—"}</p>
<p><b>${fm(o.price)}</b> · ${r?`<span style="color:var(--er)">reste ${fm(r)}</span>`:`<span style="color:var(--ok)">soldé ✓</span>`}</p>${o.notes?`<p>📏 ${esc(o.notes)}</p>`:""}
<div class="row"><button class="btn g s" onclick="move('${o.id}',-1)">←</button><button class="btn s" onclick="move('${o.id}',1)">→</button>
${r?`<button class="btn g s" onclick="pay('${o.id}')">💵</button>`:""}${o.phone?`<a class="btn g s" style="text-decoration:none" target="_blank" href="${wa(o.phone,waMsg(o))}">💬</a>`:""}
<button class="btn g s" onclick="receipt('${o.id}')">🧾</button><button class="btn g s" onclick="editOrder('${o.id}')">✏️</button>${boss()?`<button class="btn g s" onclick="delOrder('${o.id}')">🗑</button>`:""}</div></div>`}
function drawKan(){const k=$("#kan");if(!k)return;const s=q.toLowerCase();
  const L=S.orders.filter(o=>!s||(o.client+o.type+o.phone).toLowerCase().includes(s)).sort((a,b)=>(a.due||"").localeCompare(b.due||""));
  k.innerHTML=STEPS.map(([id,lb])=>{const l=L.filter(o=>o.step===id);return `<div class="col"><h3>${lb}<span class="pill">${l.length}</span></h3>${l.map(card).join("")||'<div class="empty">Vide</div>'}</div>`}).join("")}

/* ===== v4.1 : rôles, modes de paiement, mesures, mises à jour, sauvegardes chiffrées ===== */
let ROLE="boss",_cl=[],_mc=null;
const boss=()=>ROLE==="boss";
const STAFF_VIEWS=["commandes","clients","historique"];
const canView=v=>boss()||STAFF_VIEWS.includes(v);
const fill=(t,v)=>String(t||"").replace(/\{(\w+)\}/g,(m,k)=>k in v?v[k]:m);
const waMsg=o=>{const s=S.settings,r=rest(o);return fill(o.step==="pret"?s.wPret:s.wRel,{client:o.client,type:o.type,atelier:s.name,reste:r?" Reste à payer : "+fm(r)+".":"",livraison:fd(o.due),recu:rno(o)})};
const modes=()=>String(S.settings.modes||"").split(",").map(x=>x.trim()).filter(Boolean);
const modeSel=n=>`<select name="${n}">${modes().map(x=>`<option>${esc(x)}</option>`).join("")}</select>`;
function modeTotals(){const m={};S.orders.forEach(o=>(o.pay||[]).forEach(p=>{const k=p.m||"Non précisé";m[k]=(m[k]||0)+(+p.a||0)}));return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function finModes(){const L=modeTotals();return L.length?`<h3 style="margin:4px 0 8px">💳 Encaissements par mode de paiement</h3><div class="grid">${L.map(k=>`<div class="card kpi"><small>${esc(k[0])}</small><div>${fm(k[1])}</div></div>`).join("")}</div>`:""}
const hdrInfo=()=>{const c=S.settings,l1=[c.addr,[c.phone,c.phone2].filter(Boolean).join(" / ")].filter(Boolean).join(" · "),l2=[c.wa&&"WhatsApp "+c.wa,c.fb,c.nif&&"NIF "+c.nif].filter(Boolean).join(" · ");return `<p>${esc(l1)}</p>${l2?`<p>${esc(l2)}</p>`:""}`};
function logoHtml(f){const s=S.settings;if(!s.logoOn)return"";const w=f==="58"?"15mm":f==="80"?"20mm":"24mm",cu=!!s.logo;return `<div style="text-align:center"><img src="${cu?s.logo:"assets/img/logo-256.png"}" alt="" style="width:${w};height:auto;filter:${cu?"grayscale(1) contrast(1.15)":"grayscale(1) invert(1) contrast(1.15)"}"></div>`}
function pickLogo(inp){const f=inp.files&&inp.files[0];if(!f)return;if(!/^image\//.test(f.type))return toast("Choisissez une image");const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,320/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext("2d").drawImage(im,0,0,c.width,c.height);mut(()=>{S.settings.logo=c.toDataURL("image/png")},"Logo des reçus changé ✓")};im.onerror=()=>toast("Image illisible");im.src=r.result};r.readAsDataURL(f)}
const resetLogo=()=>mut(()=>{S.settings.logo=""},"Logo d’origine rétabli");
const secKeep=()=>{const s=S.settings;return{pwh:s.pwh,tfa:s.tfa,tbk:s.tbk,pin2:s.pin2,lockMin:s.lockMin}};

/* --- rappels du tableau de bord --- */
const unclaimed=()=>{const d=+S.settings.retDays;return d>0?S.orders.filter(o=>o.step==="pret"&&o.readyAt&&Date.now()-o.readyAt>d*864e5):[]};
function dashBans(){let h="";const u=unclaimed();

/* --- mots de passe solides (PBKDF2 + sel aléatoire) --- */
const PW_IT=150000;
const b2h=u=>[...new Uint8Array(u)].map(v=>v.toString(16).padStart(2,"0")).join("");
const h2b=h=>Uint8Array.from(h.match(/../g)||[],x=>parseInt(x,16));
async function pbk(pw,salt,it){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);return b2h(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt,iterations:it},k,256))}
async function mkpw(pw){const s=crypto.getRandomValues(new Uint8Array(16));return"p2$"+PW_IT+"$"+b2h(s)+"$"+await pbk(pw,s,PW_IT)}
async function vpw(pw,st){if(!st)return false;if(st.startsWith("p2$")){const[,it,s,h]=st.split("$");return await pbk(pw,h2b(s),+it)===h}return await hsh(pw)===st}
function pinCard(){const s=S.settings,on=!!s.pwh;return `<div class="card" style="margin-bottom:14px"><h3>👥 Code employé</h3><p style="color:var(--mu);margin:6px 0 10px">${on?(s.pin2?"Activé — un employé qui saisit ce code accède seulement aux commandes, clients et à l’historique (ni finances, ni tailleurs, ni paramètres, ni sauvegardes, ni suppressions).":"Donnez à votre réceptionniste un code limité : il ne verra ni les finances, ni les paramètres."):"Définissez d’abord un mot de passe."}</p>${on?`<div class="row"><button class="btn" onclick="setPin2()">${s.pin2?"Changer le code employé":"Définir un code employé"}</button>${s.pin2?`<button class="btn g" onclick="mut(()=>{S.settings.pin2=''},'Code employé retiré')">Retirer</button>`:""}</div><p style="color:var(--mu);font-size:12px;margin-top:8px">Cette restriction masque les écrans et les boutons ; elle ne chiffre pas les données. Gardez votre mot de passe pour vous.</p>`:""}</div>`}
function setPin2(){modal("Code employé",`<label>Nouveau code employé (4 caractères min., différent du mot de passe)</label><input name="p" type="password" minlength="4" required>`,d=>{(async()=>{if(await vpw(d.p,S.settings.pwh))return toast("Il doit être différent du mot de passe");const h=await mkpw(d.p);mut(()=>{S.settings.pin2=h},"Code employé activé ✓")})()})}

/* --- sauvegardes chiffrées (AES-GCM) --- */
const b64e=u=>{let s="";for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
const b64d=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function aesKey(pass,salt,it,use){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt,iterations:it},k,{name:"AES-GCM",length:256},false,[use])}
async function encBackup(obj,pass){const it=200000,salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await aesKey(pass,salt,it,"encrypt"),ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify(obj))));return{sw:"enc1",it,salt:b2h(salt),iv:b2h(iv),data:b64e(ct)}}
async function decBackup(f,pass){const key=await aesKey(pass,h2b(f.salt),f.it,"decrypt"),pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:h2b(f.iv)},key,b64d(f.data));return JSON.parse(new TextDecoder().decode(pt))}
function exportJSON(){modal("⬇ Exporter une sauvegarde",`<p style="color:var(--mu);margin:6px 0">Le fichier contient tous vos clients, commandes et finances. <b>Protégez-le avec une phrase secrète</b> (6 caractères min.) : sans elle, il est illisible. Notez-la, elle n’est pas récupérable.</p><label>Phrase secrète (vide = non chiffré)</label><input name="p" type="password" autocomplete="new-password"><p style="color:var(--mu);font-size:12px;margin-top:8px">Les réglages de sécurité (mot de passe, 2FA, code employé) ne sont jamais inclus dans la sauvegarde.</p>`,d=>{const p=String(d.p||"");if(p&&p.length<6){toast("6 caractères minimum");return false}doExport(p)},"Exporter")}
async function doExport(pass){const D=JSON.parse(JSON.stringify(S));Object.assign(D.settings,{pwh:"",tfa:"",tbk:[],pin2:""});let out=D,name="sarkin-wanka-"+today();
  try{if(pass){out=await encBackup(D,pass);name+="-chiffre"}await saveFile(name+".json",JSON.stringify(out),"application/json")}catch(e){return toast("Export annulé")}
  S.meta.lastExport=Date.now();persist();render();toast("Sauvegarde créée ✓")}
function importJSON(f){if(!f)return;f.text().then(t=>{let d;try{d=JSON.parse(t)}catch(e){return toast("Fichier invalide")}
  const go=x=>{if(!x||!Array.isArray(x.orders))return toast("Fichier invalide");ask(`Remplacer les données actuelles par ce fichier (${x.orders.length} commandes) ? Un instantané est créé avant. Les réglages de sécurité de cet appareil sont conservés.`,async()=>{await snapshot(true);mut(()=>{const kp=secKeep();S=norm(x);Object.assign(S.settings,kp)},"Données importées ✓")})};
  if(d&&d.sw==="enc1")modal("🔐 Sauvegarde chiffrée",`<label>Phrase secrète</label><input name="p" type="password" required>`,q=>{(async()=>{try{go(await decBackup(d,q.p))}catch(e){toast("Phrase secrète incorrecte ou fichier abîmé")}})()},"Déchiffrer");else go(d)})}
function resetData(){modal("⚠ Effacer toutes les données",`<p style="margin:8px 0">Commandes, clients, tailleurs, stock, dépenses et mesures seront effacés. Les réglages (nom, impression, mot de passe) sont conservés. Un instantané reste disponible dans « Instantanés automatiques ».</p><label>Tapez EFFACER pour confirmer</label><input name="c" autocomplete="off">`,d=>{if(String(d.c).trim().toUpperCase()!=="EFFACER"){toast("Confirmation incorrecte");return false}(async()=>{await snapshot(true);mut(()=>{S=norm({settings:S.settings})},"Données effacées")})()},"Effacer")}

/* --- mises à jour (sans recompiler) --- */
let UPD={st:"idle",kind:"",info:null,msg:"",native:"",busy:false,at:0};
const vcmp=(a,b)=>{const x=String(a).split(".").map(Number),y=String(b).split(".").map(Number);for(let i=0;i<3;i++){const d=(x[i]||0)-(y[i]||0);if(d)return d>0?1:-1}return 0};
const UP=()=>NATIVE&&NP("CapacitorUpdater");
async function updCheck(manual){if(UPD.busy)return;UPD.busy=true;UPD.msg="Recherche de mises à jour…";if(manual)render();
  try{const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),12000);const r=await fetch(UPD_URL+"version.json?t="+Date.now(),{cache:"no-store",signal:ctl.signal});clearTimeout(tm);if(!r.ok)throw new Error("HTTP "+r.status);const j=await r.json();UPD.info=j;
    if(UP()){try{UPD.native=(await UP().getBuiltinVersion()).version}catch(e){}}
    const w=j.web,nat=UPD.native,wNew=!!w&&vcmp(w.version,APP_VER)>0,needNat=!!(nat&&w&&w.minNative&&vcmp(nat,w.minNative)<0);
    UPD.kind=needNat?(j.apk?"apk":""):wNew?"web":"";UPD.st=UPD.kind?"avail":"none";UPD.msg=needNat&&!j.apk?"Une mise à jour Android est nécessaire mais le fichier n’est pas encore publié.":"";if(UPD.msg)UPD.st="error";UPD.at=Date.now()}
  catch(e){UPD.st="error";UPD.kind="";UPD.msg=manual?"Impossible de vérifier : connexion internet indisponible ?":""}
  UPD.busy=false;if(manual||(UPD.kind&&(location.hash||"#dashboard")==="#dashboard"&&!document.querySelector(".bg")))render()}
async function updWeb(){const j=UPD.info&&UPD.info.web,P=UP();if(!j||!P)return;UPD.busy=true;UPD.msg="Téléchargement de la version "+j.version+"…";render();
  try{await persist();await snapshot(true);const b=await P.download({url:UPD_URL+j.file,version:j.version,checksum:j.sha256});UPD.msg="Installation… l’application va redémarrer.";render();await P.set(b)}
  catch(e){UPD.busy=false;UPD.st="error";UPD.msg="Échec de la mise à jour : "+(e&&e.message||e)+". Vos données n’ont pas été modifiées.";render()}}
function updApk(){const a=UPD.info&&UPD.info.apk;if(!a)return;const l=document.createElement("a");l.href=a.url||(UPD_URL+a.file);l.target="_blank";l.rel="noopener";document.body.appendChild(l);l.click();l.remove();toast("Téléchargement lancé : ouvrez le fichier puis « Installer »")}
const updReset=()=>ask("Revenir à la version d’origine de l’application installée ? Vos données sont conservées.",()=>{UP().reset().catch(()=>toast("Impossible de revenir en arrière"))});
function bootUpdate(){const P=UP();if(P)P.notifyAppReady().catch(()=>{});setTimeout(()=>{try{if(Date.now()-(+localStorage.getItem("sw_updchk")||0)>432e5){localStorage.setItem("sw_updchk",Date.now());updCheck(false)}}catch(e){}},5000)}
function updCard(){const u=UPD,j=u.info;let st="";
  if(u.busy)st=`<p>⏳ ${esc(u.msg||"Patientez…")}</p>`;
  else if(u.st==="avail"){const x=u.kind==="apk"?j.apk:j.web;st=`<div class="ban" style="background:#dff3e7;color:var(--ok)">Nouvelle version ${esc(x.version)} disponible</div>${x.notes?`<p style="margin:6px 0 10px;white-space:pre-line">${esc(x.notes)}</p>`:""}${u.kind==="apk"?`<p style="color:var(--mu);font-size:13px;margin-bottom:8px">Cette mise à jour modifie la partie Android : Android va demander de confirmer l’installation. Vos données sont conservées.</p><button class="btn" onclick="updApk()">⬇ Télécharger l’installation</button>`:`<p style="color:var(--mu);font-size:13px;margin-bottom:8px">L’application redémarre après la mise à jour. Vos données sont conservées (un instantané est créé avant).</p><button class="btn" onclick="${NATIVE?"updWeb()":"location.reload()"}">⬇ ${NATIVE?"Mettre à jour maintenant":"Actualiser la page"}</button>`}`}
  else if(u.st==="none")st=`<p style="color:var(--ok)">✅ Vous avez la dernière version.</p>`;
  else if(u.st==="error"&&u.msg)st=`<p style="color:var(--er)">${esc(u.msg)}</p>`;
  return `<h3 style="margin:22px 0 8px">🔄 Mises à jour</h3><div class="card" style="margin-bottom:16px"><p>Version de l’application : <b>${APP_VER}</b>${u.native?` · version Android : <b>${esc(u.native)}</b>`:""}</p><p style="color:var(--mu);font-size:12px;margin:2px 0 10px">${u.at?"Dernière vérification : "+new Date(u.at).toLocaleString("fr-FR"):"Pas encore vérifié depuis l’ouverture."}</p>${st}<div class="row" style="margin-top:10px"><button class="btn g" onclick="updCheck(true)"${u.busy?" disabled":""}>🔍 Rechercher une mise à jour</button>${NATIVE&&UP()?`<button class="btn g" onclick="updReset()">↩ Version d’origine</button>`:""}</div></div>
  <h3 style="margin:22px 0 8px">⚠ Zone sensible</h3><div class="card" style="margin-bottom:22px"><p style="color:var(--mu);margin-bottom:10px">Efface les commandes, clients, tailleurs, stock, dépenses et mesures. Faites d’abord une sauvegarde.</p><button class="btn d" onclick="resetData()">🗑 Effacer toutes les données</button></div>`}

  return `<form class="card" onsubmit="saveSet(event)" style="margin-bottom:16px"><h3>🏪 Atelier & contacts</h3><label>Nom de l’atelier</label><input name="name" value="${esc(s.name)}"><div class="two"><div><label>Téléphone</label><input name="phone" type="tel" value="${esc(s.phone)}"></div><div><label>2e téléphone</label><input name="phone2" type="tel" value="${esc(s.phone2)}"></div></div><div class="two"><div><label>WhatsApp de l’atelier</label><input name="wa" type="tel" value="${esc(s.wa)}"></div><div><label>Devise</label><input name="cur" value="${esc(s.cur)}"></div></div><label>Adresse</label><input name="addr" value="${esc(s.addr)}"><div class="two"><div><label>Facebook / page</label><input name="fb" value="${esc(s.fb)}"></div><div><label>NIF / RCCM (facultatif)</label><input name="nif" value="${esc(s.nif)}"></div></div>
  ${h("🧾 Reçus")}<div class="two"><div><label>Préfixe du numéro</label><input name="pfx" maxlength="8" value="${esc(s.pfx)}"></div><div><label>Nombre de chiffres</label><input name="pad" type="number" min="3" max="8" value="${esc(s.pad)}"></div></div>${hint(`Exemple : ${esc(rno({no:12}))}. Changer le préfixe ne modifie pas les commandes existantes : leurs numéros changent d’aspect partout, y compris sur les reçus déjà imprimés à réimprimer.`)}<label>Message en bas des reçus</label><input name="foot" value="${esc(s.foot)}"><label>Conditions affichées sur le reçu</label><textarea name="cond" rows="2">${esc(s.cond)}</textarea>${hint("Écrivez {jours} pour afficher automatiquement le délai de retrait ci-dessous.")}${ck("logoOn","Afficher le logo sur les reçus et documents")}
  ${h("💳 Modes de paiement")}<label>Liste (séparés par des virgules)</label><input name="modes" value="${esc(s.modes)}">${hint("Proposés à chaque acompte et paiement. Le total par mode apparaît dans Finances.")}
  ${h("🖨 Impression")}<div class="two"><div><label>Format des reçus</label><select name="fmt">${fo(s.fmt)}</select></div><div><label>Format des documents (relevés, listes, rapports)</label><select name="fdoc">${fo(s.fdoc)}</select></div></div><label style="margin-top:12px">Ouvrir automatiquement l’impression :</label>${ck("apNew","à la création d’une commande")}${ck("apPay","à chaque paiement encaissé")}${ck("apDel","à la livraison (reçu final)")}${ck("apTp","à chaque versement à un tailleur")}${hint("Une page web ne peut pas imprimer sans afficher la fenêtre d’impression. Pour une impression 100 % silencieuse sur un PC de caisse, lancez Chrome avec l’option <code>--kiosk-printing</code>.")}
  ${h("✂ Rémunération des tailleurs (valeur par défaut)")}<div class="two"><div><label>Mode</label><select name="mode"><option value="pct"${s.mode==="pct"?" selected":""}>% du prix</option><option value="fix"${s.mode==="fix"?" selected":""}>Montant fixe / pièce</option></select></div><div><label>Valeur</label><input name="rate" type="number" min="0" value="${s.rate}"></div></div>
  ${h("💬 Messages WhatsApp")}<label>Quand le vêtement est prêt</label><textarea name="wPret" rows="2">${esc(s.wPret)}</textarea><label>Message général</label><textarea name="wRel" rows="2">${esc(s.wRel)}</textarea>${hint("Variables : {client} {type} {atelier} {reste} {livraison} {recu}")}
  ${h("⏰ Rappels")}<div class="two"><div><label>Rappel de sauvegarde (jours, 0 = non)</label><input name="bkDays" type="number" min="0" value="${esc(s.bkDays)}"></div><div><label>Vêtement non retiré après (jours, 0 = non)</label><input name="retDays" type="number" min="0" value="${esc(s.retDays)}"></div></div><button class="btn" style="margin-top:14px">Enregistrer</button></form>
  <div class="card" style="margin-bottom:16px"><h3>🖼 Logo des reçus</h3><div class="row" style="margin-top:8px;align-items:center"><img src="${s.logo||"assets/img/logo-128.png"}" alt="" style="width:64px;height:64px;object-fit:contain;border-radius:50%"><label class="btn g s" style="margin:0;cursor:pointer;color:var(--tx)">Choisir une image<input type="file" accept="image/*" hidden onchange="pickLogo(this)"></label>${s.logo?`<button class="btn g s" onclick="resetLogo()">Rétablir le logo d’origine</button>`:""}</div>${hint("Le logo est imprimé en noir et blanc. Choisissez de préférence une image sur fond clair.")}</div>
  <a href="#securite" class="card" style="display:block;text-decoration:none;color:inherit;margin-bottom:22px"><div class="row" style="justify-content:space-between;margin:0"><div><h3>🔒 Sécurité</h3><p style="color:var(--mu);margin-top:4px">Mot de passe : ${s.pwh?"activé":"non défini"} · Code employé : ${s.pin2?"activé":"non défini"} · 2FA : ${s.tfa?"activée":"désactivée"}</p></div><span class="pill">Ouvrir ›</span></div></a>`}
async function hsh(x){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("sw:"+x));return[...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,"0")).join("")}
function setPw(){modal("Mot de passe",`${S.settings.pwh?'<label>Mot de passe actuel</label><input name="o" type="password" required>':""}<label>Nouveau mot de passe (6 caractères min.)</label><input name="p" type="password" minlength="6" required><p style="color:var(--mu);font-size:12px;margin-top:8px">Notez-le bien : il n’est pas récupérable.</p>`,d=>{(async()=>{if(S.settings.pwh&&!await vpw(d.o,S.settings.pwh))return toast("Mot de passe actuel incorrect");if(S.settings.pin2&&await vpw(d.p,S.settings.pin2))return toast("Il doit être différent du code employé");const h=await mkpw(d.p);mut(()=>{S.settings.pwh=h},"Mot de passe activé 🔒")})()})}
function rmPw(){modal("Désactiver le mot de passe",`<label>Mot de passe actuel</label><input name="o" type="password" required>`,d=>{(async()=>{if(!await vpw(d.o,S.settings.pwh))return toast("Mot de passe incorrect");mut(()=>{S.settings.pwh="";S.settings.tfa="";S.settings.tbk=[];S.settings.pin2=""},"Mot de passe retiré")})()},"Désactiver")}
const B32="ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
const b32e=u=>{let b=0,v=0,o="";for(const x of u){v=(v<<8)|x;b+=8;while(b>=5){o+=B32[(v>>>(b-5))&31];b-=5}}if(b)o+=B32[(v<<(5-b))&31];return o};
const b32d=t=>{let b=0,v=0;const o=[];for(const c of t){v=(v<<5)|B32.indexOf(c);b+=5;if(b>=8){o.push((v>>>(b-8))&255);b-=8}}return new Uint8Array(o)};
async function totp(sec,off=0){let x=Math.floor(Date.now()/3e4)+off;const m=new Uint8Array(8);for(let i=7;i>=0;i--){m[i]=x&255;x=Math.floor(x/256)}const k=await crypto.subtle.importKey("raw",b32d(sec),{name:"HMAC",hash:"SHA-1"},false,["sign"]),h=new Uint8Array(await crypto.subtle.sign("HMAC",k,m)),o=h[19]&15;return String((((h[o]&127)<<24)|(h[o+1]<<16)|(h[o+2]<<8)|h[o+3])%1e6).padStart(6,"0")}
const chk=async(sec,c)=>{c=String(c).replace(/\s/g,"");for(const o of[-1,0,1])if(await totp(sec,o)===c)return true;return false};
const rc=()=>{const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";return[...crypto.getRandomValues(new Uint8Array(8))].map(x=>A[x%A.length]).join("").replace(/(.{4})/,"$1-")};
function lock(){if($("#lk"))return;ROLE="staff";const bg=document.createElement("div");bg.id="lk";bg.className="bg";bg.style.cssText="background:var(--bg);z-index:999";let step=1,fails=0;
  const draw=()=>{bg.innerHTML=`<form class="md" style="text-align:center;max-width:380px"><img src="assets/img/logo-256.png" alt="Logo" style="width:96px;height:96px;display:block;margin:0 auto 10px"><h3>${esc(S.settings.name)}</h3><p style="color:var(--mu)">${step===1?"Application verrouillée":"Vérification en deux étapes<br>Code à 6 chiffres de votre application, ou code de secours"}</p><input id="lp" type="${step===1?"password":"text"}" ${step===2?'inputmode="numeric" autocomplete="one-time-code"':""} placeholder="${step===1?(S.settings.pin2?"Mot de passe ou code employé":"Mot de passe"):"Code"}" style="margin:14px 0"><button class="btn" style="width:100%">${step===1?"Déverrouiller":"Vérifier"}</button></form>`;$("#lp").focus();
    bg.firstChild.onsubmit=async e=>{e.preventDefault();const v=$("#lp").value;let good=false,role="boss";
      if(step===1){good=await vpw(v,S.settings.pwh);if(good){if(!S.settings.pwh.startsWith("p2$")){S.settings.pwh=await mkpw(v);persist()}if(S.settings.tfa){step=2;return draw()}}else if(S.settings.pin2&&await vpw(v,S.settings.pin2)){good=true;role="staff"}}
      else{good=await chk(S.settings.tfa,v);if(!good){const i=S.settings.tbk.indexOf(await hsh("bk:"+v.trim().toUpperCase()));if(i>=0){good=true;S.settings.tbk.splice(i,1);persist()}}}
      if(good){ROLE=role;bg.remove();render()}else{fails++;toast("Code ou mot de passe incorrect");$("#lp").value="";if(fails>=3){const f=bg.firstChild.querySelector("button");f.disabled=true;await new Promise(r=>setTimeout(r,Math.min(30000,1000*2**(fails-3))));f.disabled=false}}}};
  document.body.appendChild(bg);draw()}
function needPw(t,fn){modal(t,`<label>Mot de passe actuel</label><input name="o" type="password" required>`,d=>{(async()=>{if(!await vpw(d.o,S.settings.pwh))return toast("Mot de passe incorrect");document.querySelectorAll(".bg").forEach(b=>b.remove());fn()})();return false},"Confirmer")}
function showCodes(c){modal("🔐 Codes de secours",`<p style="color:var(--mu)">Notez-les maintenant, en lieu sûr. Chaque code ne sert qu’une fois si vous perdez votre téléphone. Ils ne seront plus affichés.</p><div class="grid" style="margin-top:10px">${c.map(x=>`<div class="card" style="font:700 16px monospace;text-align:center">${x}</div>`).join("")}</div>`)}
async function newCodes(){const c=Array.from({length:8},rc),h=await Promise.all(c.map(x=>hsh("bk:"+x)));mut(()=>{S.settings.tbk=h},"Codes régénérés");showCodes(c)}
const tfaOff=()=>mut(()=>{S.settings.tfa="";S.settings.tbk=[]},"2FA désactivée");
function tfaOn(){if(!S.settings.pwh)return toast("Définissez d’abord un mot de passe");const sec=b32e(crypto.getRandomValues(new Uint8Array(20))),n=encodeURIComponent(S.settings.name),uri=`otpauth://totp/${n}:Admin?secret=${sec}&issuer=${n}`;
  modal("Activer la 2FA — application",`<p style="color:var(--mu);margin:6px 0">1. Dans Google Authenticator, Microsoft Authenticator ou Authy, ajoutez un compte avec cette clé (saisie manuelle) :</p><div class="card" style="font:700 17px monospace;letter-spacing:2px;text-align:center;word-break:break-all">${sec.match(/.{1,4}/g).join(" ")}</div><p style="margin:8px 0"><a href="${uri}">📲 Ouvrir directement dans l’application</a></p><p style="color:var(--mu)">2. Saisissez le code à 6 chiffres affiché :</p><input name="c" inputmode="numeric" maxlength="7" required>`,
  d=>{(async()=>{if(!await chk(sec,d.c))return toast("Code incorrect, réessayez");const codes=Array.from({length:8},rc),hs=await Promise.all(codes.map(c=>hsh("bk:"+c)));mut(()=>{S.settings.tfa=sec;S.settings.tbk=hs},"2FA activée ✓");document.querySelectorAll(".bg").forEach(b=>b.remove());showCodes(codes)})();return false},"Activer")}
function secView(){const s=S.settings,on=!!s.pwh,t2=!!s.tfa;
  return `<a href="#parametres" class="btn g s" style="text-decoration:none">‹ Paramètres</a>
<div class="card" style="margin:14px 0"><h3>🔑 Mot de passe</h3><p style="color:var(--mu);margin:6px 0 10px">${on?"Activé — demandé à chaque ouverture.":"Aucun mot de passe : accès libre."}</p><div class="row"><button class="btn" onclick="setPw()">${on?"Changer le mot de passe":"Définir un mot de passe"}</button>${on?`<button class="btn g" onclick="lock()">Verrouiller maintenant</button><button class="btn g" onclick="rmPw()">Désactiver</button>`:""}</div></div>
<div class="card" style="margin-bottom:14px"><h3>🛡 Vérification en deux étapes (2FA)</h3><p style="color:var(--mu);margin:6px 0 12px">${t2?"✅ Activée — un code est demandé après le mot de passe.":"Choisissez comment recevoir votre code de vérification :"}</p>
${[["📱","Application d’authentification","Google Authenticator, Microsoft Authenticator, Authy… Fonctionne sans internet. Recommandé.",1],["💬","WhatsApp","Code envoyé sur votre WhatsApp",0],["📩","SMS","Code envoyé par SMS",0],["✉️","E-mail","Code envoyé par e-mail",0]].map(c=>`<div class="row" style="justify-content:space-between;border:1px solid var(--ln);border-radius:12px;padding:10px;margin:0 0 8px"><div style="flex:1;min-width:200px"><b>${c[0]} ${c[1]}</b><br><small style="color:var(--mu)">${c[2]}</small></div>${c[3]?(t2?`<span class="pill ok">Actif</span>`:`<button class="btn s" onclick="tfaOn()">Activer</button>`):`<span class="pill wr">Nécessite un serveur</span>`}</div>`).join("")}
${t2?`<div class="row"><button class="btn g s" onclick="needPw('Nouveaux codes de secours',newCodes)">Régénérer les codes de secours (${s.tbk.length} restants)</button><button class="btn g s" onclick="needPw('Désactiver la 2FA',tfaOff)">Désactiver la 2FA</button></div>`:""}
<p style="color:var(--mu);font-size:12px;margin-top:10px">WhatsApp, SMS et e-mail ne sont pas actifs : ils exigent un serveur qui envoie le message. Un code généré et affiché sur le même appareil n’apporterait aucune sécurité. Ils pourront être branchés avec Firebase. L’horloge du téléphone doit être à l’heure.</p></div>
${pinCard()}<div class="card"><h3>⏱ Verrouillage automatique</h3><label>Verrouiller après inactivité</label><select onchange="mut(()=>{S.settings.lockMin=+this.value},'Enregistré ✓')">${[[0,"Jamais"],[1,"1 minute"],[5,"5 minutes"],[15,"15 minutes"],[60,"1 heure"]].map(m=>`<option value="${m[0]}"${+s.lockMin===m[0]?" selected":""}>${m[1]}</option>`).join("")}</select>${on?"":'<p style="color:var(--mu);font-size:12px;margin-top:6px">Nécessite un mot de passe.</p>'}</div>`}
let idle;const bump=()=>{clearTimeout(idle);const m=+S.settings.lockMin;if(m&&S.settings.pwh)idle=setTimeout(lock,m*6e4)};
["click","keydown","touchstart"].forEach(e=>addEventListener(e,bump,{passive:true}));

/* ===== ROUTEUR ===== */
function render(){const h=(location.hash||"#dashboard").slice(1);let v=VIEWS.some(x=>x[0]===h)?h:"dashboard";if(!canView(v))v="commandes";const t=VIEWS.find(x=>x[0]===v)[2];
  $("#nav").innerHTML=`<div class="brand"><img class="mono" src="assets/img/logo-256.png" alt="Logo" style="object-fit:cover;background:none"><div><b>Sarkin Wanka</b><br><small>Fashion Design · Niamey</small></div></div>`+VIEWS.filter(x=>!x[3]&&canView(x[0])).map(x=>`<a href="#${x[0]}" class="${x[0]===v||(v==="securite"&&x[0]==="parametres")?"on":""}"><span>${x[1]}</span>${x[2]}</a>`).join("");
  $("#app").innerHTML=`<div class="top"><h2><img class="toplogo" src="assets/img/logo-128.png" alt="">${t}</h2><div class="row">${v==="commandes"||v==="dashboard"?'<button class="btn" onclick="orderForm()">+ Nouvelle commande</button>':""}<span id="st" class="pill"></span></div></div>`+V[v]();stat();
  if(v==="commandes"){drawKan();$("#q").oninput=e=>{q=e.target.value;drawKan()}}if(v==="clients"){drawCl();$("#qc").oninput=e=>{qc=e.target.value.toLowerCase();drawCl()}}if(v==="historique"){drawHist();document.querySelectorAll(".hf").forEach(e=>e.onchange=()=>{hfl[e.name]=e.value;drawHist()});$("#qh").oninput=e=>{hq=e.target.value;drawHist()}}if(v==="parametres")drawSnaps();bump()}
addEventListener("hashchange",render);load();
if(!NATIVE&&"serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
